    // =========================================================================
    // 13. CHOP ETISH OQIMI: ESC/POS, BLUETOOTH (BLE), RAWBT, ANDROID KO'PRIK, TIZIM
    //     (RawBT faqat foydalanuvchi o'zi tanlaganda ishlaydi — avtomatik ushlab olinmaydi)
    // =========================================================================
    const BLE_PRINTER_SERVICES = [
      '000018f0-0000-1000-8000-00805f9b34fb',
      'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
      '49535343-fe7d-4ae5-8fa9-9fafd205e455',
      '0000ff00-0000-1000-8000-00805f9b34fb',
      '0000fff0-0000-1000-8000-00805f9b34fb',
      '0000ffe0-0000-1000-8000-00805f9b34fb',
      '0000ae30-0000-1000-8000-00805f9b34fb',
      '0000af30-0000-1000-8000-00805f9b34fb',
      '0000ff12-0000-1000-8000-00805f9b34fb'
    ];

    function getPrintEnv() {
      const ua = navigator.userAgent || '';
      return {
        native: typeof window.AndroidPrinter !== 'undefined' && !!window.AndroidPrinter,
        webBt: !!(navigator.bluetooth && typeof navigator.bluetooth.requestDevice === 'function'),
        secure: window.isSecureContext !== false,
        android: /Android/i.test(ua),
        ios: /iPhone|iPad|iPod/i.test(ua),
        telegram: typeof window.TelegramWebviewProxy !== 'undefined' || !!(window.Telegram && window.Telegram.WebApp) || /Telegram/i.test(ua)
      };
    }

    function renderPrintEnvWarningHtml(env, mode) {
      const warn = (txt) => `<div class="p-2.5 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 text-[11px] font-bold leading-relaxed">${txt}</div>`;
      if (mode === 'system') return '';
      if (mode === 'rawbt') {
        return env.android ? '' : warn("RawBT faqat Android telefonda ishlaydi.");
      }
      if (mode === 'native') {
        return env.native ? '' : warn("Android ilova ko'prigi topilmadi. Bu usul sayt maxsus Android ilova ichida ochilganda ishlaydi. Oddiy brauzerda 'Bluetooth' yoki 'RawBT' ni tanlang.");
      }
      if (env.native) return '';
      if (env.telegram && !env.webBt) {
        return warn("Telegram ichida Bluetooth ishlamaydi. Saytni <b>Chrome</b>da oching yoki usulni <b>RawBT</b> ga o'zgartiring.");
      }
      if (env.ios) {
        return warn("iPhone brauzerlari Bluetooth printerni qo'llamaydi. 'Tizim / A4' usulidan foydalaning.");
      }
      if (!env.secure) {
        return warn("Bluetooth faqat <b>https://</b> manzilda ishlaydi. Saytni https orqali oching yoki RawBT usulini tanlang.");
      }
      if (!env.webBt) {
        return warn("Bu brauzer Bluetooth'ni qo'llamaydi. Android'da <b>Chrome</b> ishlating yoki usulni <b>RawBT</b> ga o'zgartiring.");
      }
      return '';
    }

    function acquirePrintLock() {
      const now = Date.now();
      if (isPrinting || (now - lastPrintTriggerAt) < 1200) {
        return false;
      }
      isPrinting = true;
      lastPrintTriggerAt = now;
      if (printLockTimer) clearTimeout(printLockTimer);
      printLockTimer = setTimeout(() => {
        isPrinting = false;
      }, 30000);
      return true;
    }

    function releasePrintLock() {
      if (printLockTimer) clearTimeout(printLockTimer);
      setTimeout(() => {
        isPrinting = false;
      }, 600);
    }

    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    // ---- Matnni termal printer uchun baytlarga aylantirish (ASCII + kirill CP866) ----
    const CP866_MAP = (() => {
      const m = {};
      for (let i = 0; i < 32; i++) {
        const up = String.fromCharCode(0x410 + i);
        const lo = String.fromCharCode(0x430 + i);
        m[up] = 0x80 + i;
        m[lo] = i < 16 ? 0xA0 + i : 0xE0 + (i - 16);
      }
      m['Ё'] = 0xF0; m['ё'] = 0xF1;
      // O'zbek kirill harflari CP866'da yo'q — eng yaqin harfga almashtiramiz
      m['Ў'] = m['У']; m['ў'] = m['у'];
      m['Қ'] = m['К']; m['қ'] = m['к'];
      m['Ғ'] = m['Г']; m['ғ'] = m['г'];
      m['Ҳ'] = m['Х']; m['ҳ'] = m['х'];
      return m;
    })();

    function normalizePrinterText(str) {
      return String(str ?? '')
        .replace(/[ʻʼ‘’`´]/g, "'")
        .replace(/[“”«»„]/g, '"')
        .replace(/[–—−]/g, '-')
        .replace(/×/g, 'x')
        .replace(/№/g, 'No')
        .replace(/ /g, ' ');
    }

    function encodeForPrinter(str) {
      const out = [];
      for (const ch of normalizePrinterText(str)) {
        const code = ch.codePointAt(0);
        if (code === 10 || (code >= 32 && code < 127)) { out.push(code); continue; }
        if (CP866_MAP[ch] !== undefined) { out.push(CP866_MAP[ch]); continue; }
        if (code >= 0x2000) continue; // emoji va maxsus belgilarni tashlab yuboramiz
        out.push(63); // '?'
      }
      return out;
    }

    function printerTextLength(str) {
      return encodeForPrinter(str).length;
    }

    function getPrinterCharWidth() {
      const ps = appState.printer.paperSize || '80mm';
      return ps === '58mm' ? 32 : 48;
    }

    function wrapPrinterText(str, width) {
      const words = normalizePrinterText(str).split(/\s+/).filter(Boolean);
      const lines = [];
      let cur = '';
      for (const w of words) {
        if (!cur) { cur = w; }
        else if (printerTextLength(cur + ' ' + w) <= width) { cur += ' ' + w; }
        else { lines.push(cur); cur = w; }
        while (printerTextLength(cur) > width) {
          lines.push(cur.slice(0, width));
          cur = cur.slice(width);
        }
      }
      if (cur) lines.push(cur);
      return lines.length ? lines : [''];
    }

    function buildEscPosReceipt(sale) {
      const pr = appState.printer;
      const W = getPrinterCharWidth();
      const bytes = [];
      const raw = (...a) => { for (const b of a) bytes.push(b); };
      const text = (s) => { for (const b of encodeForPrinter(s)) bytes.push(b); };
      const line = (s = '') => { text(s); raw(0x0A); };
      const align = (n) => raw(0x1B, 0x61, n);
      const bold = (on) => raw(0x1B, 0x45, on ? 1 : 0);
      const size = (dw, dh) => raw(0x1D, 0x21, (dw ? 0x10 : 0) | (dh ? 0x01 : 0));
      const sep = () => line('-'.repeat(W));
      const lr = (l, r, width = W) => {
        const ll = printerTextLength(l);
        const rl = printerTextLength(r);
        if (ll + rl + 1 <= width) line(l + ' '.repeat(width - ll - rl) + r);
        else { line(l); line(' '.repeat(Math.max(0, width - rl)) + r); }
      };

      const storeTitle = pr.headerNote || appState.store.name || 'XASANBOY_OPTOM';
      const seller = sale.sellerName || appState.store.sellerName || 'Xasanboy';
      const clientPhone = sale.clientPhone || (appState.clients.find(c => c.id === sale.clientId)?.phone || '');
      const prevDebt = Number(sale.clientDebtBefore) || 0;
      const nextDebt = Number(sale.clientDebtAfter) || 0;

      raw(0x1B, 0x40);          // init
      raw(0x1B, 0x74, 17);      // CP866 (kirill)

      align(1);
      bold(1);
      if (printerTextLength(storeTitle) <= Math.floor(W / 2)) size(1, 1); else size(0, 1);
      wrapPrinterText(storeTitle, printerTextLength(storeTitle) <= Math.floor(W / 2) ? Math.floor(W / 2) : W).forEach(l => line(l));
      size(0, 0);
      bold(0);
      if (appState.store.phone) line(`Tel: ${appState.store.phone}`);
      if (appState.store.address) wrapPrinterText(appState.store.address, W).forEach(l => line(l));

      align(0);
      sep();
      lr(`No: ${sale.receiptNo || ''}`, sale.date || '');
      lr('Mijoz:', sale.clientName || 'Chakana mijoz');
      if (clientPhone) lr('', clientPhone);
      sep();

      sale.items.forEach((it, idx) => {
        const qty = Number(it.qty) || 0;
        const price = Number(it.price) || 0;
        bold(1);
        wrapPrinterText(`${idx + 1}. ${it.name}`, W).forEach(l => line(l));
        bold(0);
        lr(`   ${qty} ${it.unit || 'Dona'} x ${formatPlainNumber(price)}`, formatPlainNumber(qty * price));
      });
      sep();

      if ((Number(sale.discountAmount) || 0) > 0) lr('Chegirma:', `-${formatMoney(sale.discountAmount)}`);
      bold(1);
      size(0, 1);
      lr('JAMI:', formatMoney(sale.totalAmount));
      size(0, 0);
      bold(0);
      lr(`To'langan (${sale.paymentMethodRaw || sale.paymentType || 'Naqd'}):`, formatMoney(sale.paidAmount || 0));
      if ((Number(sale.creditAmount) || 0) > 0) lr('Nasiyaga:', formatMoney(sale.creditAmount));
      if (pr.showDebtOnReceipt && sale.clientId) {
        lr('Avvalgi balans:', formatMoney(prevDebt > 0 ? -prevDebt : 0));
        lr('Yangi balans:', formatMoney(nextDebt > 0 ? -nextDebt : 0));
      }
      if (pr.showCashierOnReceipt) line(`Sotuvchi: ${seller}`);
      sep();

      align(1);
      if (pr.escposQr) {
        const data = encodeForPrinter(`${storeTitle}|${sale.receiptNo || ''}|${sale.date}|${sale.totalAmount}`);
        const len = data.length + 3;
        raw(0x1D, 0x28, 0x6B, 0x04, 0x00, 0x31, 0x41, 0x32, 0x00);
        raw(0x1D, 0x28, 0x6B, 0x03, 0x00, 0x31, 0x43, 0x06);
        raw(0x1D, 0x28, 0x6B, 0x03, 0x00, 0x31, 0x45, 0x31);
        raw(0x1D, 0x28, 0x6B, len & 0xFF, (len >> 8) & 0xFF, 0x31, 0x50, 0x30, ...data);
        raw(0x1D, 0x28, 0x6B, 0x03, 0x00, 0x31, 0x51, 0x30);
        raw(0x0A);
      }
      wrapPrinterText(pr.footerNote || 'Xaridingiz uchun rahmat!', W).forEach(l => line(l));
      align(0);
      raw(0x0A, 0x0A, 0x0A, 0x0A);
      raw(0x1D, 0x56, 0x42, 0x00); // qog'ozni kesish (kesgichi bor printerlarda)

      return new Uint8Array(bytes);
    }

    function buildSalePlainText(sale) {
      const pr = appState.printer;
      const storeTitle = pr.headerNote || appState.store.name || 'XASANBOY_OPTOM';
      const lines = sale.items.map((it, idx) =>
        `${idx + 1}. ${it.name} (${it.qty} ${it.unit || 'Dona'} x ${formatPlainNumber(it.price)}) = ${formatPlainNumber(it.qty * it.price)}`
      ).join('\n');

      return [
        storeTitle,
        appState.store.phone ? `Tel: ${appState.store.phone}` : '',
        `No: ${sale.receiptNo || ''}`,
        `Sana: ${sale.date}`,
        `Mijoz: ${sale.clientName}`,
        '--------------------------------',
        lines,
        '--------------------------------',
        `Jami: ${formatMoney(sale.totalAmount)}`,
        `To'langan (${sale.paymentMethodRaw || sale.paymentType}): ${formatMoney(sale.paidAmount || 0)}`,
        pr.showDebtOnReceipt && sale.clientId ? `Avvalgi balans: ${formatMoney((sale.clientDebtBefore || 0) > 0 ? -sale.clientDebtBefore : 0)}` : '',
        pr.showDebtOnReceipt && sale.clientId ? `Yangi balans: ${formatMoney((sale.clientDebtAfter || 0) > 0 ? -sale.clientDebtAfter : 0)}` : '',
        pr.showCashierOnReceipt ? `Sotuvchi: ${sale.sellerName || appState.store.sellerName || 'Xasanboy'}` : '',
        pr.footerNote || 'Xaridingiz uchun rahmat!'
      ].filter(Boolean).join('\n');
    }

    function bytesToBase64(bytes) {
      let bin = '';
      const step = 0x8000;
      for (let i = 0; i < bytes.length; i += step) {
        bin += String.fromCharCode.apply(null, bytes.subarray(i, i + step));
      }
      return btoa(bin);
    }

    // ---- Chekni RASM sifatida chop etish (pdaftar uslubidagi chiroyli chek) ----
    function getPrinterDots() {
      const ps = appState.printer.paperSize || '80mm';
      return ps === '58mm' ? 384 : 576;
    }

    function formatReceiptDate(raw) {
      const m = String(raw || '').match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})/);
      return m ? `${m[3]}.${m[2]}.${m[1]} ${m[4]}:${m[5]}` : String(raw || '');
    }

    function getQrModules(text) {
      try {
        if (typeof window.qrcode === 'function') {
          if (window.qrcode.stringToBytesFuncs && window.qrcode.stringToBytesFuncs['UTF-8']) {
            window.qrcode.stringToBytes = window.qrcode.stringToBytesFuncs['UTF-8'];
          }
          const qr = window.qrcode(0, 'M');
          qr.addData(String(text));
          qr.make();
          const n = qr.getModuleCount();
          return Array.from({ length: n }, (_, r) => Array.from({ length: n }, (_, c) => qr.isDark(r, c)));
        }
      } catch (_) {}
      return generateQrMatrix(text);
    }

    async function renderReceiptCanvas(sale) {
      const dots = getPrinterDots();
      const S = dots / 384;            // 58mm = 1x, 80mm = 1.5x
      const W = 384;                    // mantiqiy kenglik
      const PAD = 10;
      const FONT = "Inter, 'Segoe UI', Roboto, Arial, sans-serif";
      try {
        if (document.fonts && document.fonts.load) {
          await Promise.race([
            Promise.all([document.fonts.load(`400 16px Inter`), document.fonts.load(`700 16px Inter`)]),
            sleep(1500)
          ]);
        }
      } catch (_) {}

      const pr = appState.printer;
      const canvas = document.createElement('canvas');
      canvas.width = dots;
      canvas.height = Math.ceil(4000 * S);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.scale(S, S);
      ctx.fillStyle = '#000';
      ctx.textBaseline = 'alphabetic';

      const font = (size, weight = 400) => { ctx.font = `${weight} ${size}px ${FONT}`; };
      const tw = (t) => ctx.measureText(String(t)).width;
      const text = (t, x, y, align = 'left') => { ctx.textAlign = align; ctx.fillText(String(t), x, y); };
      const wrap = (t, maxW) => {
        const words = String(t || '').split(/\s+/).filter(Boolean);
        const lines = [];
        let cur = '';
        for (const w of words) {
          const tryLine = cur ? cur + ' ' + w : w;
          if (tw(tryLine) <= maxW || !cur) cur = tryLine;
          else { lines.push(cur); cur = w; }
        }
        if (cur) lines.push(cur);
        return lines.length ? lines : [''];
      };
      const sep = (y) => { ctx.fillRect(PAD, y, W - PAD * 2, 1.5); };

      const storeTitle = pr.headerNote || appState.store.name || 'XASANBOY_OPTOM';
      const clientPhone = sale.clientPhone || (appState.clients.find(c => c.id === sale.clientId)?.phone || '');
      const prevDebt = Number(sale.clientDebtBefore) || 0;
      const nextDebt = Number(sale.clientDebtAfter) || 0;
      let y = 6;

      // Sarlavha
      font(26, 700);
      wrap(storeTitle, W - PAD * 2).forEach(l => { y += 30; text(l, W / 2, y, 'center'); });
      if (appState.store.phone) { font(15, 500); y += 22; text(appState.store.phone, W / 2, y, 'center'); }
      y += 16;

      // No / Sana
      font(13, 400);
      text('No', PAD, y + 12);
      text('Sana', W - PAD, y + 12, 'right');
      font(17, 600);
      text(sale.receiptNo || '', PAD, y + 34);
      text(formatReceiptDate(sale.date), W - PAD, y + 34, 'right');
      y += 46;
      sep(y); y += 8;

      // Mijoz
      font(13, 400);
      const labelW = tw('Mijoz') + 12;
      text('Mijoz', PAD, y + 20);
      font(16, 600);
      const nameMax = W - PAD * 2 - labelW;
      const nameLine = (sale.clientName || 'Chakana mijoz') + (clientPhone ? '  ' + clientPhone : '');
      wrap(nameLine, nameMax).forEach((l, i) => { text(l, PAD + labelW, y + 20 + i * 22); y += i ? 22 : 0; });
      y += 32;
      sep(y); y += 6;

      // Jadval sarlavhasi
      font(13, 400);
      text('#', PAD, y + 16);
      text('Nomi', PAD + 22, y + 16);
      text('Summa', W - PAD, y + 16, 'right');
      y += 22;

      // Mahsulotlar
      sale.items.forEach((it, idx) => {
        const qty = Number(it.qty) || 0;
        const price = Number(it.price) || 0;
        const sumTxt = formatPlainNumber(qty * price);
        font(18, 700);
        const sumW = tw(sumTxt);
        font(18, 500);
        const nameLines = wrap(it.name, W - PAD * 2 - 22 - sumW - 10);
        font(13, 400);
        text(String(idx + 1), PAD, y + 20);
        font(18, 500);
        nameLines.forEach((l, i) => text(l, PAD + 22, y + 20 + i * 22));
        font(18, 700);
        text(sumTxt, W - PAD, y + 20, 'right');
        y += 20 + (nameLines.length - 1) * 22;
        font(15, 400);
        text(`${qty} × ${formatPlainNumber(price)}`, PAD + 22, y + 20);
        y += 30;
      });
      y += 2;
      sep(y); y += 8;

      // Jami
      if ((Number(sale.discountAmount) || 0) > 0) {
        font(15, 400);
        text('Chegirma', PAD, y + 18);
        text(`-${formatMoney(sale.discountAmount)}`, W - PAD, y + 18, 'right');
        y += 24;
      }
      font(21, 700);
      text('Jami', PAD, y + 22);
      text(formatMoney(sale.totalAmount), W - PAD, y + 22, 'right');
      y += 34;

      font(16, 400);
      const row = (l, r) => { text(l, PAD, y + 16); text(r, W - PAD, y + 16, 'right'); y += 24; };
      if ((Number(sale.paidAmount) || 0) > 0) row(`To'langan (${sale.paymentMethodRaw || 'Naqd'})`, formatMoney(sale.paidAmount));
      if (pr.showDebtOnReceipt && sale.clientId) {
        row('Avvalgi balans', formatPlainNumber(prevDebt > 0 ? -prevDebt : 0));
        row('Yangi balans', formatPlainNumber(nextDebt > 0 ? -nextDebt : 0));
      }
      y += 4;
      sep(y); y += 8;

      if (pr.showCashierOnReceipt) {
        font(14, 400);
        text(`Sotuvchi: ${sale.sellerName || appState.store.sellerName || 'Xasanboy'}`, PAD, y + 16);
        y += 28;
      }

      // QR
      const mods = getQrModules(`${storeTitle}|${sale.receiptNo || ''}|${sale.date}|${sale.totalAmount}`);
      const n = mods.length;
      const cell = Math.max(3, Math.floor(170 / n));
      const qrSize = cell * n;
      const qx = Math.round((W - qrSize) / 2);
      y += 8;
      for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
          if (mods[r][c]) ctx.fillRect(qx + c * cell, y + r * cell, cell, cell);
        }
      }
      y += qrSize + 8;

      font(15, 600);
      wrap(pr.footerNote || 'Xaridingiz uchun rahmat!', W - PAD * 2).forEach(l => { y += 20; text(l, W / 2, y, 'center'); });
      y += 14;

      // Kesib olish
      const h = Math.ceil(y * S);
      const out = document.createElement('canvas');
      out.width = dots;
      out.height = h;
      out.getContext('2d').drawImage(canvas, 0, 0);
      return out;
    }

    // Canvas -> 1-bit ESC/POS raster (GS v 0), bo'laklarga bo'lib
    function canvasToEscPosRaster(canvas) {
      const w = canvas.width;
      const h = canvas.height;
      const bytesPerRow = Math.ceil(w / 8);
      const img = canvas.getContext('2d').getImageData(0, 0, w, h).data;
      const out = [0x1B, 0x40];
      const BAND = 128;
      for (let y0 = 0; y0 < h; y0 += BAND) {
        const bh = Math.min(BAND, h - y0);
        out.push(0x1D, 0x76, 0x30, 0x00, bytesPerRow & 0xFF, (bytesPerRow >> 8) & 0xFF, bh & 0xFF, (bh >> 8) & 0xFF);
        for (let y = y0; y < y0 + bh; y++) {
          for (let bx = 0; bx < bytesPerRow; bx++) {
            let byte = 0;
            for (let bit = 0; bit < 8; bit++) {
              const x = bx * 8 + bit;
              if (x >= w) continue;
              const i = (y * w + x) * 4;
              const lum = img[i] * 0.299 + img[i + 1] * 0.587 + img[i + 2] * 0.114;
              if (lum < 160) byte |= (0x80 >> bit);
            }
            out.push(byte);
          }
        }
      }
      out.push(0x1B, 0x64, 0x04);        // 4 qator surish
      out.push(0x1D, 0x56, 0x42, 0x00);  // kesish
      return new Uint8Array(out);
    }

    // ---- Bluetooth Low Energy (Chrome Web Bluetooth) ----
    async function bleFindWritableCharacteristic(server) {
      let services = [];
      try {
        services = await server.getPrimaryServices();
      } catch (_) {
        for (const uuid of BLE_PRINTER_SERVICES) {
          try { services.push(await server.getPrimaryService(uuid)); } catch (__) {}
        }
      }
      let fallback = null;
      for (const svc of services) {
        let chars = [];
        try { chars = await svc.getCharacteristics(); } catch (_) { continue; }
        for (const ch of chars) {
          const p = ch.properties || {};
          if (p.writeWithoutResponse) return ch;
          if (p.write && !fallback) fallback = ch;
        }
      }
      return fallback;
    }

    async function bleConnect(device) {
      if (!device || !device.gatt) throw new Error("Qurilma topilmadi");
      const server = device.gatt.connected ? device.gatt : await device.gatt.connect();
      const ch = await bleFindWritableCharacteristic(server);
      if (!ch) {
        try { device.gatt.disconnect(); } catch (_) {}
        throw new Error("Bu qurilmada chop etish kanali topilmadi (printer emas yoki faqat Classic Bluetooth)");
      }
      btDevice = device;
      btCharacteristic = ch;
      if (!device.__xoListening) {
        device.addEventListener('gattserverdisconnected', () => {
          if (btDevice === device) btCharacteristic = null;
          updatePrinterStatusUi();
        });
        device.__xoListening = true;
      }
      updatePrinterStatusUi();
      return ch;
    }

    function isBleConnected() {
      return !!(btDevice && btDevice.gatt && btDevice.gatt.connected && btCharacteristic);
    }

    function needsBleScan() {
      const sel = getSelectedPrinterDevice();
      if (btDevice && (!sel || !sel.bleId || sel.bleId === btDevice.id)) return false;
      if (sel && sel.bleId && navigator.bluetooth && typeof navigator.bluetooth.getDevices === 'function') return false;
      return true;
    }

    async function bleEnsureConnected() {
      if (isBleConnected()) {
        const sel = getSelectedPrinterDevice();
        if (!sel || !sel.bleId || sel.bleId === btDevice.id) return btCharacteristic;
      }
      const sel = getSelectedPrinterDevice();
      if (btDevice && (!sel || !sel.bleId || sel.bleId === btDevice.id)) {
        try { return await bleConnect(btDevice); } catch (err) { console.warn('BLE reconnect:', err); }
      }
      if (sel && sel.bleId && navigator.bluetooth && typeof navigator.bluetooth.getDevices === 'function') {
        try {
          const list = await navigator.bluetooth.getDevices();
          const dev = list.find(d => d.id === sel.bleId);
          if (dev) return await bleConnect(dev);
        } catch (err) {
          console.warn('BLE getDevices:', err);
        }
      }
      return null;
    }

    async function bleWrite(bytes) {
      const ch = await bleEnsureConnected();
      if (!ch) return false;
      const noResp = ch.properties.writeWithoutResponse && typeof ch.writeValueWithoutResponse === 'function';
      const sizes = [180, 100, 20];
      let si = 0;
      let chunk = sizes[0];
      let i = 0;
      while (i < bytes.length) {
        const part = bytes.slice(i, i + chunk);
        try {
          if (noResp) {
            await ch.writeValueWithoutResponse(part);
            await sleep(chunk >= 100 ? 15 : 8);
          } else if (typeof ch.writeValueWithResponse === 'function') {
            await ch.writeValueWithResponse(part);
          } else {
            await ch.writeValue(part);
          }
          i += part.length;
        } catch (err) {
          if (si < sizes.length - 1) { si++; chunk = sizes[si]; continue; } // kichikroq bo'laklar bilan qayta urinamiz
          throw err;
        }
      }
      return true;
    }

    async function scanBlePrinter() {
      const env = getPrintEnv();
      if (!env.webBt) {
        showToast(env.telegram ? "Telegram ichida Bluetooth ishlamaydi — Chrome'da oching yoki RawBT tanlang" : "Bu brauzer Bluetooth'ni qo'llamaydi — Chrome ishlating yoki RawBT tanlang", 'error');
        return null;
      }
      if (!env.secure) {
        showToast("Bluetooth uchun sayt https:// orqali ochilishi kerak", 'error');
        return null;
      }
      let device;
      try {
        device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: BLE_PRINTER_SERVICES
        });
      } catch (err) {
        if (err && err.name === 'NotFoundError') showToast("Printer tanlanmadi", 'info');
        else showToast(`Bluetooth: ${err?.message || err}`, 'error');
        return null;
      }

      showToast(`"${device.name || 'Qurilma'}" ga ulanmoqda...`, 'info');
      try {
        await bleConnect(device);
      } catch (err) {
        showToast(`Ulanib bo'lmadi: ${err?.message || err}. Printer yoqilganini tekshiring yoki RawBT usulini sinang.`, 'error');
        return null;
      }

      const list = Array.isArray(appState.printer.pairedDevices) ? appState.printer.pairedDevices : [];
      let entry = list.find(d => d.bleId === device.id);
      if (!entry) {
        entry = {
          id: 'ble_' + device.id,
          name: device.name || 'Bluetooth printer',
          address: '',
          bleId: device.id,
          type: 'ble',
          width: appState.printer.paperSize || '80mm',
          isPrinter: true
        };
        list.push(entry);
      } else if (device.name) {
        entry.name = device.name;
      }
      appState.printer.pairedDevices = list;
      appState.printer.selectedDeviceId = entry.id;
      appState.printer.savedDeviceName = entry.name;
      if (appState.printer.mode === 'system' || appState.printer.mode === 'rawbt' || appState.printer.mode === 'native') {
        appState.printer.mode = 'ble';
      }
      saveAppState();
      renderPrinterDevicesSection();
      updatePrinterStatusUi();
      showToast(`"${entry.name}" ulandi ✓`, 'success');
      return device;
    }

    function disconnectBlePrinter() {
      try { if (btDevice && btDevice.gatt && btDevice.gatt.connected) btDevice.gatt.disconnect(); } catch (_) {}
      btDevice = null;
      btCharacteristic = null;
      updatePrinterStatusUi();
    }

    // ---- Android ilova ko'prigi (window.AndroidPrinter) ----
    async function nativeSend(bytes, plainText) {
      const AP = window.AndroidPrinter;
      const dev = getSelectedPrinterDevice();
      const addr = dev?.address || '';
      const name = dev?.name || '';
      await sleep(60); // holat yozuvi ekranda chiqib olishi uchun (ko'prik sinxron ishlaydi)
      if (typeof AP.printBase64 === 'function') {
        const ok = (await AP.printBase64(bytesToBase64(bytes), addr, name)) !== false;
        if (!ok && typeof AP.getLastError === 'function') throw new Error(AP.getLastError() || "Printerga yuborib bo'lmadi");
        return ok;
      }
      if (typeof AP.printRawText === 'function') {
        return (await AP.printRawText(plainText, addr, name)) !== false;
      }
      if (typeof AP.printText === 'function') {
        return (await AP.printText(plainText)) !== false;
      }
      return false;
    }

    // ---- RawBT (Android ilovasi, telefonga ulangan SPP printerlar) ----
    function rawbtSend(bytes) {
      const b64 = bytesToBase64(bytes);
      window.location.href = `intent:base64,${b64}#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;`;
      return true;
    }

    // Yagona yuborish nuqtasi. RawBT yo'li birinchi await'dan oldin bajariladi,
    // shuning uchun bosish (user gesture) yo'qolmaydi.
    async function sendBytesToPrinter(bytes, plainText) {
      const mode = appState.printer.mode || 'auto';
      const env = getPrintEnv();

      if (mode === 'system') return { ok: false, reason: 'system' };

      if (mode === 'rawbt') {
        if (!env.android) return { ok: false, reason: "RawBT faqat Android telefonda ishlaydi" };
        rawbtSend(bytes);
        return { ok: true, via: 'RawBT' };
      }

      if (mode === 'native' || (mode === 'auto' && env.native)) {
        if (!env.native) return { ok: false, reason: "Android ilova ko'prigi topilmadi. Usulni 'Bluetooth' yoki 'RawBT' ga o'zgartiring." };
        let nativeErr = '';
        try {
          if (await nativeSend(bytes, plainText)) return { ok: true, via: 'Bluetooth' };
        } catch (err) {
          console.warn('AndroidPrinter error:', err);
          nativeErr = err?.message || String(err);
        }
        return { ok: false, reason: nativeErr || "Printerga yuborib bo'lmadi. Printer yoqilganini tekshiring." };
      }

      if (mode === 'ble' || mode === 'auto') {
        if (!env.webBt) {
          return {
            ok: false,
            reason: env.telegram
              ? "Telegram ichida Bluetooth ishlamaydi. Chrome'da oching yoki printer usulini RawBT ga o'zgartiring."
              : "Bu brauzer Bluetooth'ni qo'llamaydi. Chrome ishlating yoki printer usulini RawBT ga o'zgartiring."
          };
        }
        try {
          if (await bleWrite(bytes)) return { ok: true, via: 'Bluetooth' };
          return { ok: false, reason: "Printer ulanmagan. '🔍 Bluetooth printer qidirish' ni bosib printerni tanlang." };
        } catch (err) {
          btCharacteristic = null;
          updatePrinterStatusUi();
          return { ok: false, reason: `Bluetooth xatosi: ${err?.message || err}` };
        }
      }

      return { ok: false, reason: "Chop etish usuli tanlanmagan" };
    }

    function getPrinterStatusText() {

      return "Printer ulanmagan";

      };

      try {
        window.print();

        cleanup();

    async function executeSheetPrintForSale(saleId) {
      const sale = appState.sales.find(s => s.id === saleId);
      if (!sale) return;
      const mode = appState.printer.mode || 'auto';
      if (mode === 'system') {
        openSystemPreviewForSale(sale.id);
        return;
      }
      if (!acquirePrintLock()) return;
      try {
        const env = getPrintEnv();
        const plainText = buildSalePlainText(sale);

        // Printer hali tanlanmagan bo'lsa — shu bosishning o'zida qidirish oynasini ochamiz
        if ((mode === 'ble' || (mode === 'auto' && !env.native)) && env.webBt && needsBleScan()) {
          setPrintSheetStatus("Ro'yxatdan printeringizni tanlang...", 'info');
          const dev = await scanBlePrinter();
          if (!dev) {
            setPrintSheetStatus("Printer tanlanmadi. Printer yoqilganini va telefon Bluetooth'i yoniqligini tekshiring.", 'error');
            return;
          }
        }

        setPrintSheetStatus("Chek tayyorlanmoqda...", 'info');
        const bytes = await buildPrintBytes(sale);
        setPrintSheetStatus("Printerga yuborilmoqda...", 'info');
        const res = await sendBytesToPrinter(bytes, plainText);
        if (res.ok) {
          setPrintSheetStatus(`✓ ${res.via} orqali printerga yuborildi`, 'success');
          showToast("Chek printerga yuborildi", 'success');
          updatePrinterStatusUi();
          return;
        }
        setPrintSheetStatus(res.reason, 'error');
        showToast("Printerga yuborib bo'lmadi", 'error');
      } finally {
        releasePrintLock();
      }
    }

    // Savdodan keyin avtomatik chop etish: ulanish tayyor bo'lsa — darhol, aks holda chop etish oynasi ochiladi
    function autoPrintSale(saleId) {
      const sale = appState.sales.find(s => s.id === saleId);
      if (!sale) return;
      const mode = appState.printer.mode || 'auto';
      const env = getPrintEnv();
      const ready =
        (mode === 'rawbt' && env.android) ||
        ((mode === 'native' || mode === 'auto') && env.native) ||
        ((mode === 'ble' || mode === 'auto') && isBleConnected());
      if (!ready || !acquirePrintLock()) {
        setTimeout(() => openPrintSheetForSale(saleId), 220);
        return;
      }
      buildPrintBytes(sale)
        .then(bytes => sendBytesToPrinter(bytes, buildSalePlainText(sale)))
        .then(res => {
          if (res.ok) showToast(`Chek ${res.via} orqali chop etildi`, 'success');
          else {
            showToast(res.reason, 'error');
            openPrintSheetForSale(saleId);
          }
        })
        .finally(releasePrintLock);
    }

    async function refreshPairedBluetoothDevices(notify = false) {
      const pr = appState.printer;
      let list = Array.isArray(pr.pairedDevices) ? [...pr.pairedDevices] : [];
      let nativeCount = 0;
      let bleCount = 0;

      // 1) Android ilova ko'prigi — telefonga ulangan (paired) printerlarning to'liq ro'yxati
      if (typeof window.AndroidPrinter !== 'undefined' && window.AndroidPrinter && typeof window.AndroidPrinter.getPairedPrinters === 'function') {
        try {
          const raw = await window.AndroidPrinter.getPairedPrinters();
          const parsed = typeof raw === 'string' ? JSON.parse(raw) : raw;
          if (Array.isArray(parsed)) {
            const imported = parsed.map((item, idx) => ({
              id: item.id || ('bt_native_' + (item.address || idx)),
              name: item.name || "Noma'lum printer",
              address: item.address || '',
              type: 'native',
              width: pr.paperSize || '80mm',
              isPrinter: item.isPrinter !== false
            }));
            const importedAddr = new Set(imported.map(d => String(d.address || '').toUpperCase()).filter(Boolean));
            // Qo'lda kiritilgan, lekin telefonda ham ulangan printer bo'lsa — takrorlanmasin
            const dupManual = list.filter(d => d.type !== 'native' && d.type !== 'ble' && importedAddr.has(String(d.address || '').toUpperCase()));
            dupManual.forEach(d => {
              if (pr.selectedDeviceId === d.id) {
                const twin = imported.find(x => x.address.toUpperCase() === String(d.address).toUpperCase());
                if (twin) { pr.selectedDeviceId = twin.id; pr.savedDeviceName = twin.name; }
              }
            });
            list = [...list.filter(d => d.type !== 'native' && !dupManual.includes(d)), ...imported];
            if (!list.some(d => d.id === pr.selectedDeviceId)) {
              const byName = imported.find(d => d.name === pr.savedDeviceName);
              if (byName) pr.selectedDeviceId = byName.id;
            }
            nativeCount = imported.length;
          }
        } catch (err) {
          console.warn('getPairedPrinters parse error:', err);
        }
      }

      // 2) Chrome avval ruxsat bergan BLE qurilmalar (agar brauzer qo'llasa)
      if (navigator.bluetooth && typeof navigator.bluetooth.getDevices === 'function') {
        try {
          const devs = await navigator.bluetooth.getDevices();
          devs.forEach(d => {
            if (!list.some(x => x.bleId === d.id)) {
              list.push({ id: 'ble_' + d.id, name: d.name || 'Bluetooth printer', address: '', bleId: d.id, type: 'ble', width: pr.paperSize || '80mm', isPrinter: true });
              bleCount++;
            }
          });
        } catch (err) {
          console.warn('getDevices error:', err);
        }
      }

      pr.pairedDevices = list;
      if (!pr.selectedDeviceId && list.length > 0) {
        pr.selectedDeviceId = list[0].id;
        pr.savedDeviceName = list[0].name;
      }
      saveAppState();
      renderPrinterDevicesSection();
      updatePrinterStatusUi();

      if (notify) {
        if (nativeCount > 0) showToast(`${nativeCount} ta ulangan printer topildi`, 'success');
        else if (bleCount > 0) showToast(`${bleCount} ta Bluetooth qurilma qo'shildi`, 'success');
        else if (getPrintEnv().webBt) showToast("Yangi printer yo'q. '🔍 Bluetooth qidirish' ni bosing", 'info');
        else showToast("Printerlar ro'yxati yangilandi", 'info');
      }
    }

    function handleSavePrinterDeviceSubmit(e, existingId) {
      e.preventDefault();
      const name = (document.getElementById('bt-dev-name').value || '').trim();

      const width = document.getElementById('bt-dev-width').value || '80mm';
      if (!name) {
        showToast("Printer nomini kiriting", 'error');
        return;
      }

      const list = Array.isArray(appState.printer.pairedDevices) ? appState.printer.pairedDevices : [];
      if (existingId) {
        const target = list.find(d => d.id === existingId);
        if (target) {
          target.name = name;
          target.address = address;
          target.width = width;
        }
        appState.printer.selectedDeviceId = existingId;
      } else {
        const newId = uid('bt');
        list.push({ id: newId, name, address, width, type: 'manual', isPrinter: true });
        appState.printer.pairedDevices = list;
        appState.printer.selectedDeviceId = newId;
      }

      appState.printer.savedDeviceName = name;
      if (width === '80mm' || width === '58mm' || width === 'A4') {
        appState.printer.paperSize = width;
      }
      saveAppState();
      openPrinterModal(printerModalReturnSaleId);
      showToast(`"${name}" printeri saqlandi`, 'success');
    }

    function deletePrinterDevice(deviceId) {
      const dev = (appState.printer.pairedDevices || []).find(d => d.id === deviceId);

      appState.printer.pairedDevices = (appState.printer.pairedDevices || []).filter(d => d.id !== deviceId);

        appState.printer.savedDeviceName = first ? first.name : '';

      saveAppState();
      openPrinterModal(printerModalReturnSaleId);
      showToast("Printer o'chirildi", 'info');
    }

    async function runTestPrint() {
      const pr = appState.printer;
      const mode = pr.mode || 'auto';
      const sampleSale = buildTestSale();
      const statusEl = document.getElementById('printer-test-status');
      const setStatus = (msg, type) => {
        if (!statusEl) return;
        const cls = { info: 'bg-slate-50 border border-slate-200 text-slate-700', success: 'bg-emerald-50 border border-emerald-200 text-emerald-800', error: 'bg-red-50 border border-red-200 text-red-700' }[type];
        statusEl.className = `p-2.5 rounded-xl text-xs font-extrabold ${cls}`;
        statusEl.textContent = msg;
      };

      if (mode === 'system') {
        const maxWidth = pr.paperSize === 'A4' ? '100%' : (pr.paperSize === '80mm' ? '80mm' : '58mm');
        launchBrowserPrintArea(`<div style="max-width:${maxWidth};margin:0 auto;">${renderReceiptBodyHtml(sampleSale, pr, 'test-print-qr')}</div>`);
        return;
      }

      if (!acquirePrintLock()) return;
      try {
        const env = getPrintEnv();
        const plain = buildSalePlainText(sampleSale);

        if ((mode === 'ble' || (mode === 'auto' && !env.native)) && env.webBt && needsBleScan()) {
          setStatus("Ro'yxatdan printeringizni tanlang...", 'info');
          const dev = await scanBlePrinter();
          if (!dev) {
            setStatus("Printer tanlanmadi.", 'error');
            return;
          }
          renderPrinterDevicesSection();
        }

        setStatus("Test chek yuborilmoqda...", 'info');
        const bytes = await buildPrintBytes(sampleSale);
        const res = await sendBytesToPrinter(bytes, plain);
        if (res.ok) {
          setStatus(`✓ Test chek ${res.via} orqali yuborildi`, 'success');
          showToast("Test chek yuborildi", 'success');
          renderPrinterDevicesSection();
        } else {
          setStatus(res.reason, 'error');
          showToast("Printerga yuborib bo'lmadi", 'error');
        }
      } finally {
        releasePrintLock();
      }
    }

              <input id="prof-store-name" type="text" required value="${escapeHtml(appState.store.name || 'XASANBOY_OPTOM')}" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm font-bold" />
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Sotuvchi / Kassir ismi *</label>
                <input id="prof-seller-name" type="text" required value="${escapeHtml(appState.store.sellerName || 'Xasanboy')}" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm font-bold" />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Telefon raqami</label>
                <input id="prof-store-phone" type="tel" value="${escapeHtml(appState.store.phone || '')}" placeholder="+998 97 203 03 07" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm" />
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Manzil</label>
                <input id="prof-store-address" type="text" value="${escapeHtml(appState.store.address || '')}" placeholder="Manzil" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm" />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Egasi PIN-kodi (4 raqam)</label>
                ${isSalespersonMode() ? `
                  <div class="w-full px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 text-sm font-mono font-bold text-slate-400">•••• (yashirin)</div>
                ` : `
                  <input id="prof-pin-code" type="password" inputmode="numeric" maxlength="4" pattern="\\d{4}" placeholder="O'zgartirmaslik uchun bo'sh qoldiring" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm font-mono font-bold" />
                `}
              </div>
            </div>

            <button type="submit" class="w-full py-2.5 rounded-xl bg-[#5b3df5] hover:bg-[#4b2fe0] text-white text-xs font-extrabold">
              Profilni saqlash
            </button>
          </form>
        </div>

        <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm space-y-2.5">
          <div class="flex items-center justify-between">
            <span class="text-xs font-black text-slate-800">Kirish roli va panel tartibi</span>
            <button type="button" onclick="resetNavOrder()" class="text-xs font-extrabold text-[#5b3df5] hover:underline">Panelni tiklash</button>
          </div>

          <button type="button" onclick="toggleSalespersonRoleMode()" class="w-full py-2.5 px-3 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200 text-xs font-extrabold flex items-center justify-between">
            <span>🔐 Rolni almashtirish (Hozir: ${isSalespersonMode() ? 'Sotuvchi' : 'Egasi'})</span>
            <span>${isSalespersonMode() ? "Egasi →" : "Sotuvchi →"}</span>
          </button>

          <button type="button" onclick="openPrinterModal()" class="w-full py-2.5 px-3 rounded-xl bg-violet-50 hover:bg-violet-100 text-[#5b3df5] border border-violet-200 text-xs font-extrabold flex items-center justify-between">
            <span>🖨️ Printer sozlamalari va Bluetooth</span>
            <span>Ochish →</span>
          </button>
        </div>

        <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm space-y-2.5">
          <div class="flex items-center justify-between">
            <span class="text-xs font-black text-slate-800">Zaxira nusxa (JSON) va Baza holati</span>
            <span class="text-[11px] font-bold text-slate-500">Kassa: ${formatMoney(st.cashBalance)}</span>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <button type="button" onclick="exportBackupJson()" class="py-2.5 px-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-extrabold">
              ⬇ Eksport (JSON)
            </button>
            <label class="py-2.5 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-extrabold text-center cursor-pointer">
              ⬆ Import (JSON)
              <input type="file" accept=".json,application/json" onchange="importBackupJson(event)" class="hidden" />
            </label>
          </div>

          <button type="button" onclick="confirmResetEmptyDb()" class="w-full py-2.5 px-3 rounded-xl bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 text-xs font-extrabold">
            🗑️ Bazani 100% Pustoy (0) holatga qaytarish
          </button>
        </div>
      `;
    }

    function handleStoreProfileSubmit(e) {
      e.preventDefault();
      if (!guardOwnerAction("Profilni o'zgartirish faqat Egasi rejimida mumkin")) return;

      const name = (document.getElementById('prof-store-name').value || '').trim() || 'XASANBOY_OPTOM';
      const sellerName = (document.getElementById('prof-seller-name').value || '').trim() || 'Xasanboy';
      const phone = (document.getElementById('prof-store-phone').value || '').trim();
      const address = (document.getElementById('prof-store-address').value || '').trim();
      const pinRaw = (document.getElementById('prof-pin-code')?.value || '').trim();
      const pinCode = pinRaw || appState.pinCode || '1234';

      if (!/^\d{4}$/.test(pinCode)) {
        showToast("PIN-kod aniq 4 ta raqamdan iborat bo'lishi kerak", 'error');
        return;
      }

      appState.store.name = name;
      appState.store.sellerName = sellerName;
      appState.store.phone = phone;
      appState.store.address = address;
      appState.pinCode = pinCode;
      if (!appState.printer.headerNote || appState.printer.headerNote === 'XASANBOY_OPTOM') {
        appState.printer.headerNote = name;
      }
      saveAppState();
      renderAll();
      showToast("Profil sozlamalari saqlandi", 'success');
    }

    function exportBackupJson() {
      const fileName = `XASANBOY_OPTOM_backup_${new Date().toISOString().slice(0, 10)}.json`;
      if (window.AndroidPrinter && typeof window.AndroidPrinter.saveTextFile === 'function') {
        const ok = window.AndroidPrinter.saveTextFile(fileName, JSON.stringify(appState, null, 2));
        showToast(ok ? "Zaxira Yuklanmalar papkasiga saqlandi" : "Saqlashda xatolik", ok ? 'success' : 'error');
        return;
      }
      try {
        const blob = new Blob([JSON.stringify(appState, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `XASANBOY_OPTOM_backup_${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1200);
        showToast("Zaxira JSON fayl yuklab olindi", 'success');
      } catch (err) {
        console.warn('Export error:', err);
        showToast("Eksportda xatolik yuz berdi", 'error');
      }
    }

    function importBackupJson(e) {
      const file = e.target?.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result || ''));
          if (!parsed || typeof parsed !== 'object') throw new Error('Invalid JSON');
          localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
          appState = loadAppState();
          renderAll();
          showToast("Zaxira baza muvaffaqiyatli yuklandi", 'success');
        } catch (err) {
          console.warn('Import error:', err);
          showToast("JSON fayl noto'g'ri formatda", 'error');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    // =========================================================================
    // 16. DARHOL BIRINCHI KADRDA ISHGA TUSHIRISH
    // =========================================================================
    saveAppState();
    renderAll();
    if (getPrintEnv().native) {
      lastNativeRefreshAt = Date.now();
      refreshPairedBluetoothDevices(false);
    }
  </script>
</body>
</html>
