<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>XASANBOY_OPTOM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: #f4f5f9;
      color: #0f172a;
      overflow-x: hidden;
      overscroll-behavior-y: none;
    }

    @keyframes scanSweep {
      0%, 100% { transform: translateY(-40px); }
      50% { transform: translateY(40px); }
    }

    .scan-line-anim {
      animation: scanSweep 2.1s ease-in-out infinite;
    }

    @keyframes navHoldProgress {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    .nav-hold-bar {
      position: absolute;
      left: 3px;
      right: 3px;
      bottom: 1px;
      height: 3px;
      border-radius: 9999px;
      background: #5b3df5;
      transform-origin: left center;
      animation: navHoldProgress 3000ms linear forwards;
      pointer-events: none;
    }

    .nav-swap-source {
      transform: translateY(-5px) scale(1.05) !important;
      background: #ede9fe !important;
      color: #5b3df5 !important;
      border-radius: 14px;
      box-shadow: 0 8px 18px rgba(91, 61, 245, 0.22);
      z-index: 30;
    }

    .nav-swap-target {
      outline: 2px dashed #5b3df5;
      background: #f5f3ff !important;
      color: #5b3df5 !important;
      border-radius: 14px;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @media print {
      body * {
        visibility: hidden !important;
      }
      #print-area, #print-area * {
        visibility: visible !important;
      }
      #print-area {
        position: fixed !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        background: #ffffff !important;
        color: #000000 !important;
        padding: 8px !important;
        margin: 0 !important;
        box-shadow: none !important;
        border: none !important;
      }
    }
  </style>
</head>
<body class="min-h-screen select-none">

  <!-- Toast xabarnomalar -->
  <div id="toast-banner" class="fixed top-4 left-1/2 -translate-x-1/2 z-[140] pointer-events-none opacity-0 -translate-y-3 transition-all duration-200 max-w-[92vw] w-max">
    <div id="toast-inner" class="px-4 py-2.5 rounded-2xl bg-slate-900 text-white text-xs font-bold shadow-xl flex items-center gap-2 border border-slate-700">
      <span id="toast-icon">ℹ️</span>
      <span id="toast-text">Tayyor</span>
    </div>
  </div>

  <!-- Asosiy ilova qobig'i (birinchi kadrdayoq darhol ko'rinadi) -->
  <div id="app-shell" class="min-h-screen flex flex-col pb-20">
    <!-- Yuqori sarlavha paneli -->
    <header id="global-app-header" class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200/80 px-3.5 py-2.5 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 min-w-0">
        <button type="button" onclick="setActiveTab('asosiy')" title="XASANBOY_OPTOM Asosiy" class="w-10 h-10 rounded-2xl bg-[#5b3df5] hover:bg-[#4b2fe0] text-white font-black text-sm flex items-center justify-center shrink-0 shadow-sm active:scale-95 transition">
          XO
        </button>
        <div class="min-w-0">
          <div class="flex items-center gap-1.5 flex-wrap">
            <h1 id="header-business-name" class="text-sm font-black text-slate-900 truncate">XASANBOY_OPTOM</h1>
            <span class="px-1.5 py-0.5 rounded-md bg-violet-50 text-[#5b3df5] border border-violet-200/70 text-[10px] font-extrabold shrink-0">PUSTOY BAZA</span>
            <span id="role-mode-badge" class="px-1.5 py-0.5 rounded-md bg-slate-100 text-slate-700 text-[10px] font-extrabold shrink-0">Egasi</span>
          </div>
          <p id="header-business-sub" class="text-[11px] text-slate-500 truncate">100% Pustoy baza • Sotuvchi: Xasanboy</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <button type="button" onclick="openPrinterModal()" title="Printer sozlamalari" class="w-9 h-9 rounded-xl bg-violet-50 hover:bg-violet-100 text-[#5b3df5] flex items-center justify-center text-sm font-bold">
          🖨️
        </button>
        <button type="button" onclick="confirmResetEmptyDb()" title="100% Pustoy bazaga qaytarish" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center text-sm font-bold">
          🗑️
        </button>
        <button type="button" onclick="toggleSalespersonRoleMode()" title="Sotuvchi / Egasi rejimini almashtirish" class="w-9 h-9 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-700 flex items-center justify-center text-sm font-bold">
          🔐
        </button>
      </div>
    </header>

    <!-- 3 soniya bosishdan keyingi joy almashtirish banneri -->
    <div id="nav-swap-banner" class="hidden mx-3.5 mt-2.5 px-3.5 py-2 rounded-2xl bg-violet-50 border border-violet-200 flex items-center justify-between gap-2 text-xs">
      <div class="text-violet-950 font-bold">
        ↔️ Panel o'rnini almashtirish: boshqa bo'limga bosing yoki surib qo'ying
      </div>
      <button type="button" onclick="cancelNavSwapMode(true)" class="px-2.5 py-1 rounded-lg bg-white text-[#5b3df5] border border-violet-200 font-extrabold shrink-0">
        Bekor
      </button>
    </div>

    <!-- Dinamik bo'lim konteyneri -->
    <main id="main-content" class="flex-1 max-w-4xl w-full mx-auto"></main>

    <!-- Pastki navigatsiya paneli -->
    <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur border-t border-slate-200 px-1 py-1.5 grid grid-cols-7 gap-0.5 shadow-[0_-4px_16px_rgba(15,23,42,0.06)]"></nav>
  </div>

  <!-- Ichki modal / bottom sheet oyna -->
  <div id="app-modal-backdrop" class="fixed inset-0 z-[120] bg-slate-950/55 backdrop-blur-[1px] hidden items-end sm:items-center justify-center p-0 sm:p-4" onclick="handleBackdropClick(event)">
    <div id="app-modal-card" class="w-full sm:max-w-lg bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl border border-slate-200 max-h-[92vh] flex flex-col overflow-hidden" onclick="event.stopPropagation()">
      <div class="px-4 py-3.5 border-b border-slate-100 flex items-center justify-between gap-2 bg-slate-50/80">
        <div class="w-8 h-1 rounded-full bg-slate-300 mx-auto sm:hidden absolute top-2 left-1/2 -translate-x-1/2"></div>
        <h2 id="app-modal-title" class="text-sm sm:text-base font-black text-slate-900">Oyna</h2>
        <button type="button" onclick="closeAppModal()" class="w-8 h-8 rounded-xl bg-slate-200/70 hover:bg-slate-300/80 text-slate-700 font-bold text-sm flex items-center justify-center">✕</button>
      </div>
      <div id="app-modal-body" class="p-4 overflow-y-auto space-y-3 flex-1"></div>
    </div>
  </div>

  <!-- Tizim / Preview chop etish maydoni -->
  <div id="print-area" class="hidden"></div>

  <script>
    // =========================================================================
    // 1. KONSTANTALAR VA 100% PUSTOY BAZA KONFIGURATSIYASI
    // =========================================================================
    const STORAGE_KEY = 'xasanboy_optom_v4_pustoy_db';
    const DEFAULT_NAV_ORDER = ['asosiy', 'ombor', 'savdo', 'kassa', 'mijozlar', 'taminotchilar', 'profil'];
    const LONG_PRESS_MS = 3000;
    const MOVE_THRESHOLD_PX = 14;
    const MULTIPLIER_STEPS = [1, 2, 5, 10];

    function createDefaultPrinterConfig() {
      return {
        mode: 'auto', // 'auto' | 'ble' | 'rawbt' | 'native' | 'system'
        connectionType: 'Bluetooth',
        escposQr: false,
        receiptStyle: 'image', // 'image' (chiroyli, pdaftar uslubi) | 'text' (tez)
        paperSize: '80mm',
        receiptLayout: 'list',
        onlyPrinters: true,
        selectedDeviceId: '',
        savedDeviceName: '',
        pairedDevices: [],
        autoPrintReceipt: false,
        showDebtOnReceipt: true,
        showCashierOnReceipt: true,
        headerNote: 'XASANBOY_OPTOM',
        footerNote: 'Xaridingiz uchun rahmat!'
      };
    }

    function createEmptyState() {
      return {
        activeTab: 'asosiy',
        navOrder: [...DEFAULT_NAV_ORDER],
        role: 'owner', // 'owner' | 'salesperson'
        pinCode: '1234',
        receiptCounter: 0,
        store: {
          name: 'XASANBOY_OPTOM',
          phone: '',
          sellerName: 'Xasanboy',
          address: '',
          currency: 'UZS'
        },
        products: [],
        clients: [],
        suppliers: [],
        cash: [],
        sales: [],
        printer: createDefaultPrinterConfig(),
        filters: {
          productSearch: '',
          supplierSearch: '',
          clientSearch: '',
          cashType: 'Barchasi',
          cashMethod: 'Barchasi'
        },
        posUi: {
          searchOpen: false,
          searchQuery: '',
          category: 'HAMMASI',
          viewMode: 'grid', // 'grid' | 'list'
          multiplier: 1,
          quickMode: false
        },
        saleDraft: {
          clientId: '',
          paymentType: 'Naqd',
          paidAmount: 0,
          discountAmount: 0,
          items: []
        }
      };
    }

    function sanitizeNavOrder(rawOrder) {
      const valid = new Set(DEFAULT_NAV_ORDER);
      const arr = Array.isArray(rawOrder) ? rawOrder : [];
      return [
        ...arr.filter(id => valid.has(id)),
        ...DEFAULT_NAV_ORDER.filter(id => !arr.includes(id))
      ];
    }

    function loadAppState() {
      const fallback = createEmptyState();
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);

        return {
          ...fallback,
          activeTab: DEFAULT_NAV_ORDER.includes(parsed.activeTab) ? parsed.activeTab : 'asosiy',
          navOrder: sanitizeNavOrder(parsed.navOrder),
          role: parsed.role === 'salesperson' ? 'salesperson' : 'owner',
          pinCode: /^\d{4}$/.test(String(parsed.pinCode || '')) ? String(parsed.pinCode) : '1234',
          receiptCounter: Math.max(Number(parsed.receiptCounter) || 0, Array.isArray(parsed.sales) ? parsed.sales.length : 0),
          store: {
            ...fallback.store,
            ...(parsed.store || {}),
            name: (parsed.store?.name || 'XASANBOY_OPTOM').trim() || 'XASANBOY_OPTOM',
            sellerName: (parsed.store?.sellerName || 'Xasanboy').trim() || 'Xasanboy'
          },
          products: Array.isArray(parsed.products) ? parsed.products : [],
          clients: Array.isArray(parsed.clients) ? parsed.clients : [],
          suppliers: Array.isArray(parsed.suppliers) ? parsed.suppliers : [],
          cash: Array.isArray(parsed.cash) ? parsed.cash : [],
          sales: Array.isArray(parsed.sales) ? parsed.sales : [],
          printer: {
            ...createDefaultPrinterConfig(),
            ...(parsed.printer || {}),
            pairedDevices: Array.isArray(parsed.printer?.pairedDevices) ? parsed.printer.pairedDevices : [],
            mode: ['auto', 'ble', 'rawbt', 'native', 'system'].includes(parsed.printer?.mode) ? parsed.printer.mode : 'auto'
          },
          filters: {
            ...fallback.filters,
            ...(parsed.filters || {})
          },
          posUi: {
            ...fallback.posUi,
            ...(parsed.posUi || {})
          },
          saleDraft: {
            ...fallback.saleDraft,
            ...(parsed.saleDraft || {}),
            items: Array.isArray(parsed.saleDraft?.items) ? parsed.saleDraft.items : []
          }
        };
      } catch (err) {
        console.warn('loadAppState fallback:', err);
        return fallback;
      }
    }

    function saveAppState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (err) {
        console.warn('saveAppState error:', err);
      }
    }

    // =========================================================================
    // 2. GLOBAL HOLAT VA YORDAMCHI FUNKSIYALAR
    // =========================================================================
    let appState = loadAppState();

    let navHoldTimer = null;
    let navHoldSourceId = null;
    let navHoldStartX = 0;
    let navHoldStartY = 0;
    let navLongPressFired = false;
    let navSwapSourceId = null;
    let navSwapHoverId = null;

    let scannerStream = null;
    let scannerRafId = null;
    let scannerMode = 'search';
    let scannerActive = false;

    let btDevice = null;
    let btCharacteristic = null;
    let isPrinting = false;
    let printLockTimer = null;
    let lastPrintTriggerAt = 0;

    function escapeHtml(val) {
      return String(val ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatPlainNumber(num) {
      const n = Number(num) || 0;
      return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    }

    function formatMoney(num) {
      return `${formatPlainNumber(num)} UZS`;
    }

    function formatDateNow() {
      const d = new Date();
      const pad = v => String(v).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    let uidSeq = 0;
    function uid(prefix = 'id') {
      uidSeq = (uidSeq + 1) % 100000;
      return `${prefix}_${Date.now().toString(36)}_${uidSeq.toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
    }

    function isSalespersonMode() {
      return appState.role === 'salesperson';
    }

    function guardOwnerAction(actionLabel = "Bu amal faqat Egasi rejimida bajariladi") {
      if (!isSalespersonMode()) return true;
      showToast(`${actionLabel}. Profil yoki 🔐 tugmasidan Egasi rejimiga o'ting.`, 'error');
      return false;
    }

    function setActiveTab(tabId) {
      if (!DEFAULT_NAV_ORDER.includes(tabId)) return;
      appState.activeTab = tabId;
      saveAppState();
      renderAll();
    }

    // =========================================================================
    // 3. TOAST VA ICHKI MODALLAR (ALERT / CONFIRM / PROMPT ISHLATILMAYDI)
    // =========================================================================
    let toastTimeout = null;

    function showToast(message, type = 'info') {
      const banner = document.getElementById('toast-banner');
      const inner = document.getElementById('toast-inner');
      const icon = document.getElementById('toast-icon');
      const text = document.getElementById('toast-text');
      if (!banner || !inner || !text) return;

      const palette = {
        info: { cls: 'bg-slate-900 border-slate-700 text-white', ic: 'ℹ️' },
        success: { cls: 'bg-emerald-700 border-emerald-600 text-white', ic: '✅' },
        error: { cls: 'bg-red-600 border-red-500 text-white', ic: '⚠️' }
      };
      const cfg = palette[type] || palette.info;
      inner.className = `px-4 py-2.5 rounded-2xl text-xs font-bold shadow-xl flex items-center gap-2 border ${cfg.cls}`;
      if (icon) icon.textContent = cfg.ic;
      text.textContent = message;

      banner.classList.remove('opacity-0', '-translate-y-3');
      banner.classList.add('opacity-100', 'translate-y-0');

      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        banner.classList.remove('opacity-100', 'translate-y-0');
        banner.classList.add('opacity-0', '-translate-y-3');
      }, 2800);
    }

    function openAppModal(title, htmlContent) {
      const backdrop = document.getElementById('app-modal-backdrop');
      const titleEl = document.getElementById('app-modal-title');
      const bodyEl = document.getElementById('app-modal-body');
      if (!backdrop || !titleEl || !bodyEl) return;

      titleEl.textContent = title;
      bodyEl.innerHTML = htmlContent;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function closeAppModal() {
      stopCameraScanner();
      const backdrop = document.getElementById('app-modal-backdrop');
      if (!backdrop) return;
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
    }

    function handleBackdropClick(e) {
      if (e.target && e.target.id === 'app-modal-backdrop') {
        closeAppModal();
      }
    }

    function openConfirmModal(title, message, confirmLabel, onConfirmCallback, danger = false) {
      window.__pendingConfirmAction = () => {
        closeAppModal();
        if (typeof onConfirmCallback === 'function') onConfirmCallback();
      };
      const btnCls = danger
        ? 'bg-red-600 hover:bg-red-700 text-white'
        : 'bg-[#5b3df5] hover:bg-[#4b2fe0] text-white';

      openAppModal(title, `
        <p class="text-sm text-slate-600 leading-relaxed">${escapeHtml(message)}</p>
        <div class="grid grid-cols-2 gap-2.5 pt-2">
          <button type="button" onclick="closeAppModal()" class="py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-extrabold">Bekor qilish</button>
          <button type="button" onclick="window.__pendingConfirmAction && window.__pendingConfirmAction()" class="py-2.5 rounded-xl ${btnCls} text-xs font-extrabold">${escapeHtml(confirmLabel || 'Tasdiqlash')}</button>
        </div>
      `);
    }

    // =========================================================================
    // 4. ROL REJIMI (EGASI / SOTUVCHI) VA 100% PUSTOY BAZAGA TOZALASH
    // =========================================================================
    function toggleSalespersonRoleMode() {
      if (appState.role === 'owner') {
        appState.role = 'salesperson';
        saveAppState();
        renderAll();
        showToast("Sotuvchi (Salesperson) rejimi yoqildi", 'info');
      } else {
        openOwnerPinModal();
      }
    }

    function openOwnerPinModal() {
      openAppModal("🔐 Egasi rejimiga qaytish", `
        <div class="space-y-3">
          <p class="text-xs text-slate-600">Ma'muriy va o'chirish amallarini ochish uchun 4 xonali PIN-kodni kiriting.</p>
          <input id="owner-pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="••••" onkeydown="if(event.key==='Enter') verifyOwnerPinModal();" class="w-full px-4 py-2.5 rounded-2xl border border-slate-200 text-center text-xl font-black tracking-[0.5em]" />
          <div class="grid grid-cols-2 gap-2">
            <button type="button" onclick="closeAppModal()" class="py-2.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-extrabold">Bekor qilish</button>
            <button type="button" onclick="verifyOwnerPinModal()" class="py-2.5 rounded-xl bg-[#5b3df5] hover:bg-[#4b2fe0] text-white text-xs font-extrabold">Tasdiqlash</button>
          </div>
        </div>
      `);
      setTimeout(() => {
        const inp = document.getElementById('owner-pin-input');
        if (inp) inp.focus();
      }, 60);
    }

    function verifyOwnerPinModal() {
      const inp = document.getElementById('owner-pin-input');
      const code = (inp?.value || '').trim();
      if (code === String(appState.pinCode || '1234')) {
        appState.role = 'owner';
        saveAppState();
        closeAppModal();
        renderAll();
        showToast("Egasi rejimi faollashtirildi", 'success');
      } else {
        showToast("PIN-kod noto'g'ri", 'error');
      }
    }

    function confirmResetEmptyDb() {
      if (!guardOwnerAction("Bazani tozalash faqat Egasi rejimida mumkin")) return;
      openConfirmModal(
        "100% Pustoy bazaga qaytarish",
        "Barcha mahsulotlar, mijozlar, ta'minotchilar, savdolar/nakladnoylar va kassa yozuvlari o'chirilib, baza 0 holatga qaytarilsinmi?",
        "Ha, tozalash",
        () => {
          const fresh = createEmptyState();
          fresh.store = { ...appState.store };
          fresh.pinCode = appState.pinCode;
          fresh.role = appState.role;
          fresh.navOrder = [...appState.navOrder];
          fresh.printer = {
            ...createDefaultPrinterConfig(),
            ...(appState.printer || {}),
            pairedDevices: [...(appState.printer?.pairedDevices || [])]
          };
          appState = fresh;
          saveAppState();
          renderAll();
          showToast("Baza 100% pustoy (0) holatga qaytarildi", 'success');
        },
        true
      );
    }

    // =========================================================================
    // 5. PASTKI PANELNI 3 SONIYA BOSIB USHLAB JOY ALMASHTIRISH
    // =========================================================================
    function getNavCatalog() {
      return {
        asosiy: {
          id: 'asosiy',
          label: 'Asosiy',
          icon: `<path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>`
        },
        ombor: {
          id: 'ombor',
          label: 'Ombor',
          icon: `<path d="M20 2H4c-1 0-2 .9-2 2v3.01c0 .72.43 1.34 1 1.69V20c0 1.1 1.1 2 2 2h14c.9 0 2-.9 2-2V8.7c.57-.35 1-.97 1-1.69V4c0-1.1-1-2-2-2zm-5 12H9v-2h6v2zm5-7H4V4h16v3z"/>`
        },
        savdo: {
          id: 'savdo',
          label: 'Savdo',
          icon: `<path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>`
        },
        kassa: {
          id: 'kassa',
          label: 'Kassa',
          icon: `<path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>`
        },
        mijozlar: {
          id: 'mijozlar',
          label: 'Mijozlar',

    function clearNavHoldBar() {
      if (navHoldTimer) {
        clearTimeout(navHoldTimer);
        navHoldTimer = null;
      }
      document.querySelectorAll('#bottom-nav .nav-hold-bar').forEach(el => el.remove());
      navHoldSourceId = null;
    }

    function syncSwapBanner() {
      const banner = document.getElementById('nav-swap-banner');
      if (!banner) return;
      if (navSwapSourceId) banner.classList.remove('hidden');
      else banner.classList.add('hidden');
    }

    function activateNavSwapMode(tabId) {
      navLongPressFired = true;
      navSwapSourceId = tabId;
      navSwapHoverId = tabId;
      clearNavHoldBar();
      syncSwapBanner();
      renderBottomNav();
      if (navigator.vibrate) {
        try { navigator.vibrate(40); } catch (_) {}
      }
      showToast("3 soniya bosib ushlandi — boshqa bo'limga bosing yoki suring", 'info');
    }

    function cancelNavSwapMode(notify = false) {
      const wasActive = !!navSwapSourceId;
      navSwapSourceId = null;
      navSwapHoverId = null;
      clearNavHoldBar();
      syncSwapBanner();
      renderBottomNav();
      if (wasActive && notify) showToast("Joy almashtirish bekor qilindi", 'info');
    }

    function swapNavItems(idA, idB) {
      if (!idA || !idB || idA === idB) return false;
      const order = sanitizeNavOrder(appState.navOrder);
      const iA = order.indexOf(idA);
      const iB = order.indexOf(idB);
      if (iA === -1 || iB === -1) return false;
      [order[iA], order[iB]] = [order[iB], order[iA]];
      appState.navOrder = order;
      saveAppState();
      return true;
    }

    function commitNavSwap(targetId) {
      if (!navSwapSourceId) return;
      const src = navSwapSourceId;
      navSwapSourceId = null;
      navSwapHoverId = null;
      clearNavHoldBar();
      syncSwapBanner();
      if (src !== targetId && swapNavItems(src, targetId)) {
        renderAll();
        showToast("Bo'limlar o'rni almashtirildi", 'success');
      } else {
        renderBottomNav();
      }
    }

    function findNavIdAtPoint(clientX, clientY) {
      const nav = document.getElementById('bottom-nav');
      if (!nav) return null;
      const rect = nav.getBoundingClientRect();
      if (clientY < rect.top - 28 || clientY > rect.bottom + 18) return null;
      const btns = nav.querySelectorAll('button[data-nav-id]');
      for (const b of btns) {
        const r = b.getBoundingClientRect();
        if (clientX >= r.left && clientX <= r.right) {
          return b.getAttribute('data-nav-id');
        }
      }
      return null;
    }

    function handleNavPointerDown(e, tabId) {
      if (navSwapSourceId) {
        if (navSwapSourceId === tabId) cancelNavSwapMode(true);
        else commitNavSwap(tabId);
        return;
      }

      const pt = e.touches && e.touches[0] ? e.touches[0] : e;
      navHoldSourceId = tabId;
      navHoldStartX = pt.clientX || 0;
      navHoldStartY = pt.clientY || 0;
      navLongPressFired = false;

      if (navHoldTimer) clearTimeout(navHoldTimer);
      document.querySelectorAll('#bottom-nav .nav-hold-bar').forEach(el => el.remove());

      const bar = document.createElement('span');
      bar.className = 'nav-hold-bar';
      e.currentTarget.appendChild(bar);

      navHoldTimer = setTimeout(() => {
        if (navHoldSourceId === tabId) {
          activateNavSwapMode(tabId);
        }
      }, LONG_PRESS_MS);
    }

    function handleNavPointerMove(e, tabId) {
      const pt = e.touches && e.touches[0] ? e.touches[0] : e;
      const cx = pt.clientX || 0;
      const cy = pt.clientY || 0;

      if (navSwapSourceId) {
        const hovered = findNavIdAtPoint(cx, cy);
        if (hovered && hovered !== navSwapHoverId) {
          navSwapHoverId = hovered;
          renderBottomNav();
        }
        return;
      }

      if (!navHoldTimer || navHoldSourceId !== tabId) return;
      if (Math.hypot(cx - navHoldStartX, cy - navHoldStartY) > MOVE_THRESHOLD_PX) {
        clearNavHoldBar();
      }
    }

    function handleNavPointerUp(e, tabId) {
      if (navSwapSourceId) {
        const pt = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0] : e;
        const dropId = findNavIdAtPoint(pt.clientX || 0, pt.clientY || 0);
        if (dropId && dropId !== navSwapSourceId) commitNavSwap(dropId);
        else if (navSwapHoverId && navSwapHoverId !== navSwapSourceId) commitNavSwap(navSwapHoverId);
        return;
      }

      const wasLong = navLongPressFired;
      const valid = navHoldSourceId === tabId;
      clearNavHoldBar();
      navLongPressFired = false;

      if (!wasLong && valid) {
        setActiveTab(tabId);
      }
    }

    function handleNavPointerCancel() {
      if (!navSwapSourceId) {
        clearNavHoldBar();
        navLongPressFired = false;
      }
    }

    function resetNavOrder() {
      appState.navOrder = [...DEFAULT_NAV_ORDER];
      navSwapSourceId = null;
      navSwapHoverId = null;
      syncSwapBanner();
      saveAppState();
      renderAll();
      showToast("Pastki panel standart tartibga qaytarildi", 'success');
    }

    function renderBottomNav() {
      const nav = document.getElementById('bottom-nav');
      if (!nav) return;
      const catalog = getNavCatalog();
      const order = sanitizeNavOrder(appState.navOrder);

      nav.innerHTML = order.map(id => {
        const item = catalog[id];
        if (!item) return '';
        const active = appState.activeTab === id;
        const isSrc = navSwapSourceId === id;
        const isTarget = navSwapSourceId && navSwapSourceId !== id && navSwapHoverId === id;

        let cls = active ? 'text-[#5b3df5]' : 'text-slate-400 hover:text-slate-600';
        if (isSrc) cls = 'nav-swap-source font-extrabold';
        else if (isTarget) cls = 'nav-swap-target font-extrabold';

        return `
          <button
            type="button"
            data-nav-id="${item.id}"
            onpointerdown="handleNavPointerDown(event, '${item.id}')"
            onpointermove="handleNavPointerMove(event, '${item.id}')"
            onpointerup="handleNavPointerUp(event, '${item.id}')"
            onpointercancel="handleNavPointerCancel()"
            oncontextmenu="event.preventDefault()"
            class="relative select-none flex flex-col items-center justify-center py-1 rounded-xl transition ${cls}"
          >
            <svg class="w-5 h-5 fill-current mb-0.5 pointer-events-none" viewBox="0 0 24 24">${item.icon}</svg>
            <span class="text-[9.5px] leading-tight truncate max-w-full px-0.5 pointer-events-none ${active || isSrc || isTarget ? 'font-extrabold' : 'font-semibold'}">${item.label}</span>
          </button>
        `;
      }).join('');
    }

    // =========================================================================
    // 6. HISOB-KITOBLAR VA ASOSIY (DASHBOARD)
    // =========================================================================
    function computeStats() {
      let cashIn = 0;
      let cashOut = 0;
      let naqd = 0;
      let karta = 0;
      let bank = 0;

      for (const tx of appState.cash) {
        const amt = Number(tx.amount) || 0;
        const isIn = tx.direction === 'in';
        if (isIn) cashIn += amt;
        else cashOut += amt;

        const signed = isIn ? amt : -amt;
        if (tx.method === 'Karta') karta += signed;
        else if (tx.method === 'Bank') bank += signed;
        else naqd += signed;
      }

      const clientDebt = appState.clients.reduce((s, c) => s + (Number(c.debt) || 0), 0);
      const supplierDebt = appState.suppliers.reduce((s, sp) => s + (Number(sp.debt) || 0), 0);
      const stockSaleValue = appState.products.reduce((s, p) => s + ((Number(p.qty) || 0) * (Number(p.price) || 0)), 0);

      return {
        cashBalance: cashIn - cashOut,
        cashIn,
        cashOut,
        naqd,
        karta,
        bank,
        clientDebt,
        supplierDebt,
        stockSaleValue
      };
    }

    function handleQuickStockAdjustSubmit(e, productId) {
      e.preventDefault();
      const prod = appState.products.find(p => p.id === productId);
      if (!prod) return;

    function recalcInlineSupplierPayment() {
      const qty = Math.max(0, Number(document.getElementById('prod-qty')?.value) || 0);
      const cost = Math.max(0, Number(document.getElementById('prod-cost')?.value) || 0);
      const total = qty * cost;

      const paidInp = document.getElementById('inline-sup-paid-amount');
      const totalEl = document.getElementById('inline-arrival-total');
      const remEl = document.getElementById('inline-sup-rem-debt');
      if (!paidInp || !totalEl || !remEl) return;

      let paid = Math.max(0, Number(paidInp.value) || 0);
      if (paid > total) paid = total;

      totalEl.textContent = formatMoney(total);
      remEl.textContent = formatMoney(Math.max(0, total - paid));
    }

    function setInlinePartialPreset(ratio) {
      const qty = Math.max(0, Number(document.getElementById('prod-qty')?.value) || 0);
      const cost = Math.max(0, Number(document.getElementById('prod-cost')?.value) || 0);
      const total = qty * cost;
      const paidInp = document.getElementById('inline-sup-paid-amount');
      if (!paidInp) return;
      paidInp.value = String(Math.round(total * ratio));
      recalcInlineSupplierPayment();
    }

    function handleProductFormSubmit(e, editProductId) {
      e.preventDefault();
      const name = (document.getElementById('prod-name').value || '').trim();
      const category = (document.getElementById('prod-category')?.value || '').trim();
      const unit = (document.getElementById('prod-unit').value || 'Dona').trim() || 'Dona';
      const barcode = (document.getElementById('prod-barcode').value || '').trim();
      const qty = Math.max(0, Number(document.getElementById('prod-qty').value) || 0);
      const cost = Math.max(0, Number(document.getElementById('prod-cost').value) || 0);
      const price = Math.max(0, Number(document.getElementById('prod-price').value) || 0);
      const favorite = Boolean(document.getElementById('prod-favorite')?.checked);

      if (!name) {
        showToast("Mahsulot nomini kiriting", 'error');
        return;
      }

      const pendingSupName = (document.getElementById('inline-new-sup-name')?.value || '').trim();
      let supId = document.getElementById('prod-supplier-select')?.value || '';
      if (!supId && pendingSupName) {
        const created = createInlineSupplierNow();
        if (created) supId = created.id;
      }
      const supObj = appState.suppliers.find(s => s.id === supId) || null;

      if (editProductId) {
        const prod = appState.products.find(p => p.id === editProductId);
        if (prod) {
          prod.name = name;
          prod.category = category;
          prod.unit = unit;
          prod.barcode = barcode;
          prod.qty = qty;
          prod.cost = cost;
          prod.price = price;
          prod.favorite = favorite;
          prod.supplierId = supObj ? supObj.id : '';
          prod.supplierName = supObj ? supObj.name : '';
        }
        saveAppState();
        closeAppModal();
        renderActiveTab();
        showToast("Mahsulot yangilandi", 'success');
        return;
      }

      appState.products.unshift({
        id: uid('prod'),
        name,
        category,
        unit,
        barcode,
        qty,
        cost,
        price,
        favorite,
        supplierId: supObj ? supObj.id : '',
        supplierName: supObj ? supObj.name : ''
      });

      const totalSum = qty * cost;
      if (supObj && totalSum > 0) {
        const channel = document.getElementById('inline-sup-pay-channel')?.value || 'Naqd';
        let paid = Math.max(0, Number(document.getElementById('inline-sup-paid-amount')?.value) || 0);
        if (paid > totalSum) paid = totalSum;
        const remDebt = Math.max(0, totalSum - paid);

        supObj.totalBought = (Number(supObj.totalBought) || 0) + totalSum;
        supObj.debt = (Number(supObj.debt) || 0) + remDebt;
        supObj.history = Array.isArray(supObj.history) ? supObj.history : [];
        supObj.history.unshift({
          id: uid('sh'),
          date: formatDateNow(),
          type: 'prixod',
          productName: name,
          qty,
          unit,
          totalSum,
          paidAmount: paid,
          remainingDebt: remDebt,
          paymentType: remDebt > 0 && paid > 0 ? `${channel} + Nasiya` : (remDebt > 0 ? 'Nasiya' : channel)
        });

        if (paid > 0) {
          appState.cash.unshift({
            id: uid('cash'),
            date: formatDateNow(),
            direction: 'out',
            method: channel,
            amount: paid,
            title: `Kirim to'lovi (${supObj.name}): ${name} (${qty} ${unit})`
          });
        }
      }

      saveAppState();
      closeAppModal();
      renderActiveTab();
      showToast("Mahsulot omborga qo'shildi", 'success');
    }

    async function startCameraScanner() {
      stopCameraScanner();
      scannerActive = true;
      const statusEl = document.getElementById('scanner-status-box');
      const videoEl = document.getElementById('scanner-video');

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        if (statusEl) {
          statusEl.className = 'p-2.5 rounded-xl bg-amber-50 text-amber-800 text-xs font-bold';
          statusEl.textContent = "Kamera topilmadi — shtrix-kodni qo'lda kiriting.";
        }
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        scannerStream = stream;
        if (videoEl) {
          videoEl.srcObject = stream;
          await videoEl.play().catch(() => {});
        }

        let detector = null;
        if (typeof window.BarcodeDetector === 'function') {
          try {
            detector = new window.BarcodeDetector({
              formats: ['ean_13', 'ean_8', 'code_128', 'code_39', 'upc_a', 'upc_e', 'qr_code']
            });
          } catch (_) {
            detector = new window.BarcodeDetector();
          }
        }

        if (statusEl) {
          statusEl.className = 'p-2.5 rounded-xl bg-emerald-50 text-emerald-800 text-xs font-bold';
          statusEl.textContent = detector
            ? "Kamera faol — kod avtomatik aniqlanadi yoki qo'lda kiriting."
            : "Kamera faol. Kodni pastdagi maydon orqali kiriting.";
        }

        if (detector && videoEl) {
          const loop = async () => {
            if (!scannerActive || !videoEl) return;
            if (videoEl.readyState >= 2) {
              try {
                const found = await detector.detect(videoEl);
                if (found && found.length > 0 && found[0].rawValue) {
                  processScannedBarcode(found[0].rawValue);
                  return;
                }
              } catch (_) {}
            }
            scannerRafId = requestAnimationFrame(loop);
          };
          scannerRafId = requestAnimationFrame(loop);
        }
      } catch (err) {
        console.warn('Camera fallback:', err);
        if (statusEl) {
          statusEl.className = 'p-2.5 rounded-xl bg-amber-50 text-amber-800 text-xs font-bold';
          statusEl.textContent = "Kamera ruxsati berilmadi. Shtrix-kodni qo'lda kiritib tekshiring.";
        }
      }
    }

    function stopCameraScanner() {
      scannerActive = false;
      if (scannerRafId) {
        cancelAnimationFrame(scannerRafId);
        scannerRafId = null;
      }
      if (scannerStream) {
        scannerStream.getTracks().forEach(t => t.stop());
        scannerStream = null;
      }
    }

    function stashProductFormAndScan(editId) {
      const values = {};
      PRODUCT_FORM_FIELDS.forEach(id => {
        const el = document.getElementById(id);
        if (el) values[id] = el.value;
      });
      values.__favorite = Boolean(document.getElementById('prod-favorite')?.checked);
      productFormStash = { editId: editId || null, values };
      openScannerModal('add_product');
    }

    function restoreStashedProductForm(code = null) {
      stopCameraScanner();
      const stash = productFormStash;
      productFormStash = null;
      openProductModal(stash?.editId || null, code || '');
      if (!stash) return;
      Object.entries(stash.values).forEach(([id, val]) => {
        if (id.startsWith('__')) return;
        const el = document.getElementById(id);
        if (el && val !== undefined) el.value = val;
      });
      const fav = document.getElementById('prod-favorite');
      if (fav) fav.checked = stash.values.__favorite;
      if (code) {
        const bc = document.getElementById('prod-barcode');
        if (bc) bc.value = code;
      }
      onInlineSupplierChange();
      recalcInlineSupplierPayment();
    }

    function processScannedBarcode(rawCode) {
      const code = String(rawCode || '').trim();
      if (!code) {
        showToast("Shtrix-kod bo'sh", 'error');
        return;
      }

      stopCameraScanner();
      const matched = appState.products.find(p => String(p.barcode || '').trim().toLowerCase() === code.toLowerCase());

      if (scannerMode === 'add_product') {
        restoreStashedProductForm(code);
        showToast(`Kod kiritildi: ${code}`, 'success');
        return;
      }

      closeAppModal();

      if (matched) {
        if (scannerMode === 'sale') {
          const mult = Number(appState.posUi?.multiplier) || 1;
          addProductToSaleDraft(matched.id, mult);
          setActiveTab('savdo');
        } else {
          appState.filters.productSearch = code;
          setActiveTab('ombor');
          showToast(`Topildi: ${matched.name}`, 'success');
        }
      } else {
        openConfirmModal(
          "Yangi shtrix-kod / SKU",
          `"${code}" kodli mahsulot omborda topilmadi. Yangi mahsulot sifatida qo'shasizmi?`,
          "+ Tovar qo'shish",
          () => openProductModal(null, code)
        );
      }
    }

              ${totalCount === 0 ? `
                <button
                  type="button"
                  onclick="openProductModal()"

                  >
                    <div>
                      <div class="text-[10px] font-bold text-slate-500">Savatcha • ${draft.items.length} xil (${totalCount} ta)</div>
                      <div class="text-sm font-black text-slate-900">${formatMoney(totalAmount)}</div>

                    <span class="text-xs font-extrabold text-[#5b3df5] underline">Savatcha</span>

                  <button

                  >
                    Hisob-kitob →
                  </button>
                </div>
              `}
            </div>
          </div>
        </div>
      `;
    }

    function togglePosSearchBar() {
      appState.posUi.searchOpen = !appState.posUi.searchOpen;
      if (!appState.posUi.searchOpen) appState.posUi.searchQuery = '';
      saveAppState();
      renderActiveTab();
      if (appState.posUi.searchOpen) {
        setTimeout(() => document.getElementById('pos-search-input')?.focus(), 40);
      }
    }

    function togglePosQuickMode() {
      appState.posUi.quickMode = !appState.posUi.quickMode;
      saveAppState();
      renderActiveTab();
      showToast(appState.posUi.quickMode ? "Tezkor rejim yoqildi" : "Oddiy rejim yoqildi", 'info');
    }

    function togglePosViewMode() {
      appState.posUi.viewMode = appState.posUi.viewMode === 'list' ? 'grid' : 'list';
      saveAppState();
      renderActiveTab();
    }

    function cyclePosMultiplier() {
      const cur = Number(appState.posUi.multiplier) || 1;
      const idx = MULTIPLIER_STEPS.indexOf(cur);
      const next = MULTIPLIER_STEPS[(idx + 1) % MULTIPLIER_STEPS.length];
      appState.posUi.multiplier = next;
      saveAppState();
      renderActiveTab();
      showToast(`Miqdor karrasi: ${next}X`, 'info');
    }

    function selectPosCategory(cat) {
      appState.posUi.category = cat || 'HAMMASI';
      saveAppState();
      renderActiveTab();
    }

    function handlePosProductTap(productId) {
      const mult = Number(appState.posUi?.multiplier) || 1;
      addProductToSaleDraft(productId, mult);
      if (appState.posUi.quickMode && appState.saleDraft.items.length > 0) {
        openPosCheckoutModal();
      }
    }

    function addProductToSaleDraft(productId, addQty) {
      const prod = appState.products.find(p => p.id === productId);
      if (!prod) return;

      const qtyToAdd = Math.max(1, Number(addQty) || 1);
      const existing = appState.saleDraft.items.find(it => it.productId === prod.id);
      if (existing) {
        existing.qty = (Number(existing.qty) || 0) + qtyToAdd;
      } else {
        appState.saleDraft.items.push({
          productId: prod.id,
          name: prod.name,
          unit: prod.unit || 'Dona',
          barcode: prod.barcode || '',
          qty: qtyToAdd,
          price: Number(prod.price) || 0,
          cost: Number(prod.cost) || 0
        });
      }
      saveAppState();
      renderActiveTab();
      showToast(`"${prod.name}" (+${qtyToAdd}) savatchaga qo'shildi`, 'success');
    }

    function changeSaleDraftQty(index, delta) {
      const item = appState.saleDraft.items[index];
      if (!item) return;
      const nextQty = (Number(item.qty) || 0) + delta;
      if (nextQty <= 0) appState.saleDraft.items.splice(index, 1);
      else item.qty = nextQty;
      saveAppState();
      renderActiveTab();
    }

    function clearSaleDraft() {
      appState.saleDraft.items = [];
      appState.saleDraft.discountAmount = 0;
      saveAppState();
      renderActiveTab();
    }

    function openPosCustomerActionModal() {
      openAppModal("👤 Mijoz tanlash yoki qo'shish", `
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Savdo uchun mijozni tanlang</label>
            <select id="pos-client-select" onchange="appState.saleDraft.clientId = this.value; saveAppState(); renderActiveTab();" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-xs font-bold bg-white">
              <option value="">Chakana mijoz</option>
              ${appState.clients.map(c => `<option value="${c.id}" ${appState.saleDraft.clientId === c.id ? 'selected' : ''}>${escapeHtml(c.name)} ${c.phone ? '(' + escapeHtml(c.phone) + ')' : ''} — Qarz: ${formatMoney(c.debt || 0)}</option>`).join('')}
            </select>
          </div>

          <div class="p-3 rounded-2xl bg-slate-50 border border-slate-200 space-y-2.5">
            <div class="text-xs font-black text-slate-900">+ Tezkor yangi mijoz yaratish</div>
            <input id="pos-new-client-name" type="text" placeholder="Mijoz ismi / do'kon nomi *" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs bg-white" />
            <input id="pos-new-client-phone" type="tel" placeholder="Telefon raqami" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs bg-white" />
            <button type="button" onclick="createPosQuickClient()" class="w-full py-2.5 rounded-xl bg-[#5b3df5] hover:bg-[#4b2fe0] text-white text-xs font-extrabold">
              Mijozni yaratish va biriktirish
            </button>
          </div>

          <button type="button" onclick="closeAppModal()" class="w-full py-2.5 rounded-xl bg-slate-100 text-slate-800 text-xs font-extrabold">Tayyor</button>
        </div>
      `);
    }

    function createPosQuickClient() {
      const name = (document.getElementById('pos-new-client-name')?.value || '').trim();
      const phone = (document.getElementById('pos-new-client-phone')?.value || '').trim();
      if (!name) {
        showToast("Mijoz ismini kiriting", 'error');
        return;
      }

      const newClient = {
        id: uid('cli'),
        name,
        phone,
        note: '',
        debt: 0,
        history: []
      };
      appState.clients.unshift(newClient);
      appState.saleDraft.clientId = newClient.id;
      saveAppState();
      closeAppModal();
      renderActiveTab();
      showToast(`"${name}" mijozlarga qo'shildi`, 'success');
    }

    function openPosCartDrawerModal() {
      const draft = appState.saleDraft;
      const subtotal = draft.items.reduce((s, it) => s + ((Number(it.qty) || 0) * (Number(it.price) || 0)), 0);
      const discount = Math.max(0, Math.min(subtotal, Number(draft.discountAmount) || 0));
      const totalAmount = Math.max(0, subtotal - discount);

      openAppModal("🛒 Savatcha", `
        <div class="space-y-3">
          ${draft.items.length === 0 ? `
            <div class="py-6 text-center text-xs text-slate-400 font-semibold">Savatcha bo'sh</div>
          ` : `
            <div class="divide-y divide-slate-100 border border-slate-200/80 rounded-2xl px-3">
              ${draft.items.map((item, idx) => `
                <div class="py-2.5 flex items-center justify-between gap-2">
                  <div class="min-w-0">
                    <div class="text-xs font-extrabold text-slate-900 truncate">${escapeHtml(item.name)}</div>
                    <div class="text-[11px] text-slate-500">${formatMoney(item.price)} × ${item.qty} = <strong class="text-slate-800">${formatMoney(item.price * item.qty)}</strong></div>
                  </div>
                  <div class="flex items-center gap-1.5 shrink-0">
                    <button type="button" onclick="changeSaleDraftQty(${idx}, -1); openPosCartDrawerModal();" class="w-7 h-7 rounded-lg bg-slate-100 font-black text-xs">-</button>
                    <span class="text-xs font-extrabold w-5 text-center">${item.qty}</span>
                    <button type="button" onclick="changeSaleDraftQty(${idx}, 1); openPosCartDrawerModal();" class="w-7 h-7 rounded-lg bg-slate-100 font-black text-xs">+</button>
                  </div>
                </div>
              `).join('')}
            </div>
          `}

          <div class="p-3 rounded-2xl bg-slate-50 border border-slate-200 flex items-center justify-between">
            <span class="text-xs font-extrabold text-slate-700">Jami summa:</span>
            <span class="text-base font-black text-[#5b3df5]">${formatMoney(totalAmount)}</span>
          </div>

    function onCheckoutPayTypeChange(subtotal) {
      const pt = document.getElementById('checkout-pay-type')?.value;
      const disc = Math.max(0, Math.min(subtotal, Number(document.getElementById('checkout-discount')?.value) || 0));
      const total = Math.max(0, subtotal - disc);
      const paidInp = document.getElementById('checkout-paid-amount');
      if (paidInp) {
        paidInp.value = String(pt === 'Nasiya' ? 0 : total);
      }
      recalcCheckoutSummary(subtotal);
    }

    function setCheckoutPaidPreset(subtotal, ratio) {
      const disc = Math.max(0, Math.min(subtotal, Number(document.getElementById('checkout-discount')?.value) || 0));
      const total = Math.max(0, subtotal - disc);
      const paidInp = document.getElementById('checkout-paid-amount');
      if (paidInp) {
        paidInp.value = String(Math.round(total * ratio));
      }
      recalcCheckoutSummary(subtotal);
    }

    function recalcCheckoutSummary(subtotal) {
      const disc = Math.max(0, Math.min(subtotal, Number(document.getElementById('checkout-discount')?.value) || 0));
      const total = Math.max(0, subtotal - disc);
      let paid = Math.max(0, Number(document.getElementById('checkout-paid-amount')?.value) || 0);
      if (paid > total) paid = total;
      const addedDebt = Math.max(0, total - paid);

      const clientId = document.getElementById('checkout-client')?.value || '';
      const cli = appState.clients.find(c => c.id === clientId);
      const prevDebt = cli ? (Number(cli.debt) || 0) : 0;
      const nextDebt = prevDebt + addedDebt;

      const totEl = document.getElementById('checkout-total-display');
      const prevEl = document.getElementById('checkout-prev-bal');
      const nextEl = document.getElementById('checkout-next-bal');

      if (totEl) totEl.textContent = formatMoney(total);
      if (prevEl) prevEl.textContent = formatMoney(prevDebt > 0 ? -prevDebt : 0);
      if (nextEl) nextEl.textContent = formatMoney(nextDebt > 0 ? -nextDebt : 0);
    }

    function handlePosCheckoutSubmit(e) {
      e.preventDefault();
      const draft = appState.saleDraft;
      if (!Array.isArray(draft.items) || draft.items.length === 0) {
        showToast("Savatcha bo'sh", 'error');
        return;
      }

      const clientId = document.getElementById('checkout-client')?.value || '';
      const client = appState.clients.find(c => c.id === clientId) || null;
      const payType = document.getElementById('checkout-pay-type')?.value || 'Naqd';

      let subtotal = 0;
      for (const item of draft.items) {
        subtotal += (Number(item.qty) || 0) * (Number(item.price) || 0);
      }

      const discount = Math.max(0, Math.min(subtotal, Number(document.getElementById('checkout-discount')?.value) || 0));
      const totalAmount = Math.max(0, subtotal - discount);
      let paidNow = Math.max(0, Number(document.getElementById('checkout-paid-amount')?.value) || 0);
      if (paidNow > totalAmount) paidNow = totalAmount;
      const creditDebt = Math.max(0, totalAmount - paidNow);

      if (creditDebt > 0 && !client) {
        showToast("Nasiya yoki qisman qarz qoldirish uchun mijozni tanlang", 'error');
        return;
      }

      // Tekshiruvdan o'tgandan keyingina ombordan ayiramiz
      for (const item of draft.items) {
        const prod = appState.products.find(p => p.id === item.productId);
        if (prod) {
          prod.qty = Math.max(0, (Number(prod.qty) || 0) - (Number(item.qty) || 0));
        }
      }

      const saleId = uid('sale');
      const cashTxId = paidNow > 0 ? uid('cash') : '';
      const channel = payType === 'Nasiya' ? 'Naqd' : payType;
      if (paidNow > 0) {
        appState.cash.unshift({
          id: cashTxId,
          saleId,
          date: formatDateNow(),
          direction: 'in',
          method: channel,
          amount: paidNow,
          title: `Savdo (${payType}): ${client ? client.name : 'Chakana mijoz'}`
        });
      }

      const prevDebt = client ? (Number(client.debt) || 0) : 0;
      if (client) {
        if (creditDebt > 0) client.debt = prevDebt + creditDebt;
        client.history = Array.isArray(client.history) ? client.history : [];
        client.history.unshift({
          saleId,
          date: formatDateNow(),
          title: `Savdo (${payType}) — ${draft.items.length} xil tovar`,
          totalAmount,
          paidAmount: paidNow,
          addedDebt: creditDebt
        });
      }
      const nextDebt = client ? (Number(client.debt) || 0) : 0;

      const dNow = new Date();
      appState.receiptCounter = (Number(appState.receiptCounter) || 0) + 1;
      const receiptNo = `${String(dNow.getDate()).padStart(2, '0')}.${String(dNow.getMonth() + 1).padStart(2, '0')}-#${appState.receiptCounter}`;

      const saleRecord = {
        id: saleId,
        cashTxId,
        receiptNo,
        date: formatDateNow(),
        clientId: client ? client.id : '',
        clientName: client ? client.name : 'Chakana mijoz',
        clientPhone: client ? (client.phone || '') : '',
        clientDebtBefore: prevDebt,
        clientDebtAfter: nextDebt,
        sellerName: appState.store.sellerName || 'Xasanboy',
        paymentMethodRaw: channel,
        paymentType: creditDebt > 0 && paidNow > 0 ? `${channel} + Nasiya` : (creditDebt > 0 ? 'Nasiya' : channel),
        paidAmount: paidNow,
        creditAmount: creditDebt,
        discountAmount: discount,
        totalAmount,
        items: draft.items.map(it => ({ ...it }))
      };

      appState.sales.push(saleRecord);
      appState.saleDraft.items = [];
      appState.saleDraft.discountAmount = 0;
      appState.saleDraft.paymentType = payType;
      saveAppState();
      closeAppModal();
      renderActiveTab();
      openReceiptModal(saleRecord.id);

      if (appState.printer.autoPrintReceipt) {
        autoPrintSale(saleRecord.id);
      }
    }

    function handleCashSubmit(e) {
      e.preventDefault();

      const method = document.getElementById('cash-method').value;

      closeAppModal();

    function onPrixodProductChange() {
      const sel = document.getElementById('prixod-prod-select');
      const newBox = document.getElementById('prixod-new-prod-fields');
      const costInp = document.getElementById('prixod-cost');
      if (!sel || !newBox || !costInp) return;

      if (sel.value === '__new__') {
        newBox.classList.remove('hidden');
      } else {
        newBox.classList.add('hidden');
        const p = appState.products.find(it => it.id === sel.value);
        if (p && Number(p.cost) > 0) costInp.value = String(p.cost);
      }
      recalcPrixodDebt();
    }

    function recalcPrixodDebt() {
      const qty = Math.max(0, Number(document.getElementById('prixod-qty')?.value) || 0);
      const cost = Math.max(0, Number(document.getElementById('prixod-cost')?.value) || 0);
      const total = qty * cost;
      const paidInp = document.getElementById('prixod-paid-sum');
      let paid = Math.max(0, Number(paidInp?.value) || 0);
      if (paid > total) paid = total;

      const totalEl = document.getElementById('prixod-total-sum');
      const remEl = document.getElementById('prixod-rem-debt');
      if (totalEl) totalEl.textContent = formatMoney(total);
      if (remEl) remEl.textContent = formatMoney(Math.max(0, total - paid));
    }

    function handlePrixodSubmit(e, supplierId) {
      e.preventDefault();
      const sup = appState.suppliers.find(s => s.id === supplierId);
      if (!sup) return;

      const prodSelVal = document.getElementById('prixod-prod-select').value;
      const qty = Math.max(0, Number(document.getElementById('prixod-qty').value) || 0);
      const cost = Math.max(0, Number(document.getElementById('prixod-cost').value) || 0);
      const channel = document.getElementById('prixod-pay-channel').value;
      let paid = Math.max(0, Number(document.getElementById('prixod-paid-sum').value) || 0);

      const totalSum = qty * cost;
      if (paid > totalSum) paid = totalSum;
      const remDebt = Math.max(0, totalSum - paid);

      let prodName = '';
      let prodUnit = 'dona';

      if (prodSelVal === '__new__') {
        prodName = (document.getElementById('prixod-new-name').value || '').trim();
        const sellPrice = Math.max(0, Number(document.getElementById('prixod-sell-price').value) || 0);
        prodUnit = (document.getElementById('prixod-unit').value || 'dona').trim() || 'dona';
        if (!prodName) {
          showToast("Yangi mahsulot nomini kiriting", 'error');
          return;
        }
        appState.products.unshift({
          id: uid('prod'),
          name: prodName,
          category: '',
          unit: prodUnit,
          barcode: '',
          qty,
          cost,
          price: sellPrice,
          favorite: false,
          supplierId: sup.id,
          supplierName: sup.name
        });
      } else {
        const existingProd = appState.products.find(p => p.id === prodSelVal);
        if (!existingProd) return;
        existingProd.qty = (Number(existingProd.qty) || 0) + qty;
        existingProd.cost = cost;
        existingProd.supplierId = sup.id;
        existingProd.supplierName = sup.name;
        prodName = existingProd.name;
        prodUnit = existingProd.unit || 'dona';
      }

      sup.totalBought = (Number(sup.totalBought) || 0) + totalSum;
      sup.debt = (Number(sup.debt) || 0) + remDebt;
      sup.history = Array.isArray(sup.history) ? sup.history : [];
      sup.history.unshift({
        id: uid('sh'),
        date: formatDateNow(),
        type: 'prixod',
        productName: prodName,
        qty,
        unit: prodUnit,
        totalSum,
        paidAmount: paid,
        remainingDebt: remDebt,
        paymentType: remDebt > 0 && paid > 0 ? `${channel} + Nasiya` : (remDebt > 0 ? 'Nasiya' : channel)
      });

      if (paid > 0) {
        appState.cash.unshift({
          id: uid('cash'),
          date: formatDateNow(),
          direction: 'out',
          method: channel,
          amount: paid,
          title: `Prixod (${sup.name}): ${prodName} (${qty} ${prodUnit})`
        });
      }

      saveAppState();
      closeAppModal();
      renderActiveTab();
      showToast(`Kirim qilindi. Qolgan qarz: ${formatMoney(remDebt)}`, 'success');
    }

      openAppModal(`💸 Ta'minotchiga to'lov — ${sup.name}`, `

    // =========================================================================
    // 12. NAKLADNOY, CANVAS QR-KOD VA PRINTERGA CHOP ETISH
    // =========================================================================
    function generateQrMatrix(text) {
      const data = String(text || 'XASANBOY_OPTOM');
      const size = 21;
      const grid = Array.from({ length: size }, () => Array(size).fill(false));

      const drawFinder = (r0, c0) => {
        for (let r = -1; r <= 7; r++) {
          for (let c = -1; c <= 7; c++) {
            const rr = r0 + r;
            const cc = c0 + c;
            if (rr < 0 || rr >= size || cc < 0 || cc >= size) continue;
            const inBorder = r === 0 || r === 6 || c === 0 || c === 6;
            const inCenter = r >= 2 && r <= 4 && c >= 2 && c <= 4;
            grid[rr][cc] = inBorder || inCenter;
          }
        }
      };

      drawFinder(0, 0);
      drawFinder(0, size - 7);
      drawFinder(size - 7, 0);

      for (let i = 8; i < size - 8; i++) {
        grid[6][i] = i % 2 === 0;
        grid[i][6] = i % 2 === 0;
      }

      let hash = 2166136261;
      for (let i = 0; i < data.length; i++) {
        hash ^= data.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }

      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const inTopLeft = r < 8 && c < 8;
          const inTopRight = r < 8 && c >= size - 8;
          const inBottomLeft = r >= size - 8 && c < 8;
          const inTiming = r === 6 || c === 6;
          if (inTopLeft || inTopRight || inBottomLeft || inTiming) continue;

          const mix = ((hash >>> ((r * size + c) % 24)) ^ (r * 31 + c * 17 + data.length * 13)) & 255;
          grid[r][c] = (mix % 3) !== 0;
        }
      }
      return grid;
    }

    // Haqiqiy (skanerlanadigan) QR — qrcode-generator kutubxonasi orqali.
    // Kutubxona yuklanmasa, oldingi bezak-naqsh ishlatiladi. Rasm <img> ko'rinishida bo'lgani uchun
    // brauzer chop etishida ham bo'sh chiqmaydi.
    function makeQrDataUrl(payload) {
      const text = String(payload || 'XASANBOY_OPTOM');
      try {
        if (typeof window.qrcode === 'function') {
          if (window.qrcode.stringToBytesFuncs && window.qrcode.stringToBytesFuncs['UTF-8']) {
            window.qrcode.stringToBytes = window.qrcode.stringToBytesFuncs['UTF-8'];
          }
          const qr = window.qrcode(0, 'M');
          qr.addData(text);
          qr.make();
          return qr.createDataURL(5, 10);
        }
      } catch (err) {
        console.warn('QR library error:', err);
      }
      try {
        const matrix = generateQrMatrix(text);
        const cells = matrix.length;
        const scale = 6;
        const quiet = 12;
        const dim = cells * scale + quiet * 2;
        const canvas = document.createElement('canvas');
        canvas.width = dim;
        canvas.height = dim;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, dim, dim);
        ctx.fillStyle = '#0f172a';
        for (let r = 0; r < cells; r++) {
          for (let c = 0; c < cells; c++) {
            if (matrix[r][c]) ctx.fillRect(quiet + c * scale, quiet + r * scale, scale, scale);
          }
        }
        return canvas.toDataURL('image/png');
      } catch (_) {
        return '';
      }
    }

      return `<img id="${escapeHtml(canvasId)}" src="${src}" alt="QR" style="width:112px;height:112px;margin:0 auto;display:block;image-rendering:pixelated;border-radius:12px;border:1px solid #e2e8f0;background:#fff;" />`;
    }

    function reopenSaleForEditing(saleId) {
      const idx = appState.sales.findIndex(s => s.id === saleId);
      if (idx === -1) return;
      const sale = appState.sales[idx];

      for (const it of sale.items) {
        const prod = appState.products.find(p => p.id === it.productId);
        if (prod) prod.qty = (Number(prod.qty) || 0) + (Number(it.qty) || 0);
      }
      if (sale.clientId) {
        const cli = appState.clients.find(c => c.id === sale.clientId);
        if (cli) {
          if ((Number(sale.creditAmount) || 0) > 0) {
            cli.debt = Math.max(0, (Number(cli.debt) || 0) - (Number(sale.creditAmount) || 0));
          }
          if (Array.isArray(cli.history)) {
            cli.history = cli.history.filter(h => h.saleId !== sale.id);
          }
        }
      }
      // Kassadagi shu savdo kirimini olib tashlaymiz (aks holda qayta sotilganda pul 2 marta yoziladi)
      if ((Number(sale.paidAmount) || 0) > 0) {
        const before = appState.cash.length;
        appState.cash = appState.cash.filter(tx => !(tx.saleId === sale.id || (sale.cashTxId && tx.id === sale.cashTxId)));
        if (appState.cash.length === before) {
          // Eski yozuvlar (saleId bog'lanmagan): summasi va sanasi mos keladigan birinchi kirimni o'chiramiz
          const idxTx = appState.cash.findIndex(tx => tx.direction === 'in' && Number(tx.amount) === Number(sale.paidAmount) && tx.date === sale.date && String(tx.title || '').startsWith('Savdo'));
          if (idxTx !== -1) appState.cash.splice(idxTx, 1);
        }
      }

      appState.saleDraft = {
        clientId: sale.clientId || '',
        paymentType: sale.paymentMethodRaw || 'Naqd',
        paidAmount: Number(sale.paidAmount) || 0,
        discountAmount: Number(sale.discountAmount) || 0,
        items: sale.items.map(it => ({ ...it }))
      };

      appState.sales.splice(idx, 1);
      saveAppState();
      closeAppModal();
      setActiveTab('savdo');
      openPosCartDrawerModal();
      showToast("Sotuv tahrirlash uchun savatchaga qaytarildi", 'info');
    }

                return `
                  <button

    function setPrintSheetStatus(message, type = 'info') {
      const box = document.getElementById('print-sheet-status');
      if (!box) return;
      const cls = {
        info: 'bg-slate-50 border border-slate-200 text-slate-700',

      }[type] || '';
